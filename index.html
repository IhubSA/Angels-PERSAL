          <div class="fg"><label class="f">Employee<select onchange="A.pfPerson(this.value)">${U.peopleOpts(PV.personId, x => x.status === 'Active' && x.cat !== 'Volunteer' && x.cat !== 'Bursary holder')}</select></label><label class="f">KPA library<select onchange="A.pfLib(this.value)">${U.opts(Object.keys(LIBS), PV.lib)}</select></label></div>
          <div class="small muted">${esc(p.title)} · ${esc(p.dept)} · direct manager: ${p.dm ? esc(St.nameOf(p.dm)) : '—'} · review period Mar 2026 – Feb 2027</div>
          <div class="row" style="gap:6px">${SCALE.map(x => pill(x, 'x')).join('')}</div>
          <div class="tw"><table class="tbl"><thead><tr><th>KPA</th><th>Manager</th><th>Employee</th><th>Evidence / comments</th></tr></thead><tbody>
            ${kpas.map(([t, d], i) => { const m = sc['m' + i] || '', e = sc['e' + i] || '', need = m && (Number(m) < 3 || Number(m) > 4); return `<tr><td><div style="font-weight:700">${t}</div><div class="small muted">${d}</div></td><td><input class="sc" inputmode="numeric" maxlength="1" value="${m}" aria-label="Manager score" onchange="A.pfScore('m${i}',this.value)"></td><td><input class="sc" inputmode="numeric" maxlength="1" value="${e}" aria-label="Employee score" onchange="A.pfScore('e${i}',this.value)"></td><td><input class="in" style="font-size:12px;padding:6px 8px;${need && !sc['n' + i] ? 'border-color:var(--r)' : ''}" value="${U.attr(sc['n' + i] || '')}" placeholder="${need ? 'Reason required for a ' + m : 'Evidence'}" onchange="A.pfScore('n${i}',this.value)"></td></tr>`; }).join('')}
          </tbody></table></div>
          <div class="note">Scoring guide: score evidence, not personality. A score <strong>below 3 or above 4 needs a written reason</strong>, so the system won't save it without one.</div>
          <div class="row"><button class="btn pri" onclick="A.pfSubmit()">Submit for sign-off (employee, manager, HR)</button><button class="btn" onclick="A.pfDev()">Add development actions</button></div>
        </section>
        <div style="display:flex;flex-direction:column;gap:16px">
          <section class="card pad"><h2 class="h2">KPA set-up checklist</h2>
            <div style="display:flex;flex-direction:column;gap:8px;font-size:14px">${checks.map((c, i) => `<label class="row" style="gap:10px;flex-wrap:nowrap"><input type="checkbox" ${s.kpaChecks[i] ? 'checked' : ''} onchange="A.pfCheck(${i},this.checked)">${c}</label>`).join('')}</div>
            <p class="small" style="margin:12px 0 0;color:var(--a)">Each KPA library currently holds 5 KPAs, while the checklist asks for 5–8 per role. Libraries also have no SMART indicators filled in yet.</p></section>
          <section class="card pad"><h2 class="h2">KPA libraries</h2><div class="row" style="gap:6px">${Object.keys(LIBS).map(l => `<button class="pill ${l === PV.lib ? 'b' : 'x'}" style="border:0;cursor:pointer" onclick="A.pfLib('${l}')">${l}</button>`).join('')}</div></section>
        </div>
      </div>
      <section class="card" style="min-width:0">
        <div class="between" style="padding:16px 20px 4px"><h2 class="h2" style="margin:0">Performance review register</h2><span class="small muted">Confidential · kept 3 years</span></div>
        <div style="padding:0 8px 8px">${table(['Employee', 'Role', 'Review date', 'Rating', 'Action required', 'PIP issued', 'Next review'], s.reviews.map(r => `<tr><td style="font-weight:700"><a href="#/person/${r.personId}" style="text-decoration:none">${esc(St.nameOf(r.personId))}</a></td><td>${esc(r.role)}</td><td class="nw">${St.fmtDate(r.date)}</td><td>${pill(r.rating, RATING_CLS(r.rating))}</td><td>${esc(r.action)}</td><td>${esc(r.pip)}</td><td class="muted">${esc(/^\d{4}-/.test(r.next) ? St.fmtDate(r.next) : r.next)}</td></tr>`))}</div>
      </section>
      ${pip ? `<section class="card pad">
        <div class="between" style="margin-bottom:14px"><h2 class="h2" style="margin:0">Open PIP · ${esc(St.nameOf(pip.personId))}</h2><span class="m xs muted">HR-07-FRM-01 · HR-07-PROC-01</span></div>
        <div class="grid g-tiles" style="font-size:13px">${[['Performance issues', pip.issues], ['Required standard', pip.standard], ['Support', pip.support], ['Check-ins', pip.checkins.join(' · ')]].map(b => `<div class="box"><div style="font-weight:800;margin-bottom:4px">${b[0]}</div><div class="muted">${esc(b[1])}</div></div>`).join('')}</div>
        <div class="row" style="margin-top:14px"><button class="btn ok" onclick="A.pipOut('close')">Improved → close PIP</button><button class="btn warn" onclick="A.pipOut('extend')">Partial → extend PIP</button><button class="btn bad" onclick="A.pipOut('escalate')">No improvement → escalate to HR-03</button></div>
        <p class="small muted" style="margin:12px 0 0">A PIP is corrective and developmental, not disciplinary. Signed by employee, manager and HR.</p>
      </section>` : '<div class="card empty">No open performance improvement plans.</div>'}`;
    }
  };
  Object.assign(A, {
    pfPerson(id) { PV.personId = id; PV.scores = {}; A.refresh(); },
    pfLib(l) { PV.lib = l; PV.scores = {}; A.refresh(); },
    pfScore(k, v) { if (k[0] !== 'n') { v = v.replace(/[^1-5]/g, '').slice(0, 1); } PV.scores[k] = v; A.refresh(); },
    pfCheck(i, on) { S().kpaChecks[i] = on; St.save(); },
    pfSubmit() {
      const kpas = LIBS[PV.lib], sc = PV.scores;
      for (let i = 0; i < kpas.length; i++) {
        const m = Number(sc['m' + i]);
        if (!m) return U.toast('Enter a manager score (1–5) for every KPA', 'bad');
        if ((m < 3 || m > 4) && !sc['n' + i]) return U.toast('A written reason is required for "' + kpas[i][0] + '" (score ' + m + ')', 'bad');
      }
      const avg = kpas.reduce((n, _, i) => n + Number(sc['m' + i]), 0) / kpas.length, r = Math.round(avg);
      const rating = SCALE[5 - r];
      const p = St.person(PV.personId);
      const rv = { id: St.uid('rv'), personId: p.id, role: p.title, date: St.todayIso(), rating, action: r <= 2 ? 'PIP' : r === 3 ? '1 step (annual review)' : '2 steps (annual review)', pip: r <= 2 ? 'Yes' : 'No', next: St.iso(St.addDays(new Date(), r <= 2 ? 30 : 365)) };
      S().reviews.unshift(rv);
      if (r <= 2) S().pips.unshift({ id: St.uid('pip'), personId: p.id, status: 'Open', issues: kpas.filter((_, i) => Number(sc['m' + i]) < 3).map(k => k[0]).join(', ') + ' below standard', standard: 'Agree measurable standard with the direct manager', support: 'Coaching and training to be agreed', checkins: [St.fmtShort(St.iso(St.addDays(new Date(), 14))) + ' next'] });

    },

      const s = S(), emp = s.people.filter(p => p.status === 'Active' && (St.isEmployee(p) || p.cat.includes('ntern')) && !s.reviews.some(r => r.personId === p.id && r.rating === 'Not set'));
      U.modal('Start review cycle', `<p style="margin:0">This adds a "Set KPAs" line to the register for <strong>${emp.length}</strong> people who do not have one open yet, so HR can track the cycle.</p><label class="f">Review period<input name="per" value="Mar 2027 – Feb 2028"></label>`, [{ label: 'Cancel' }, { label: 'Start cycle', cls: 'pri', onClick: m => {
        emp.forEach(p => s.reviews.push({ id: St.uid('rv'), personId: p.id, role: p.title, date: '', rating: 'Not set', action: 'Set KPAs', pip: '—', next: 'KPAs due before ' + U.val(m, 'per').split('–')[0].trim() }));
        St.log('Changed', '—', 'Review cycle started: ' + U.val(m, 'per')); St.save(); U.toast('Review cycle started for ' + emp.length + ' people', 'ok'); A.refresh();
      } }]);
    },
    pipOut(kind) {
      const pip = S().pips.find(x => x.status === 'Open'); const name = St.nameOf(pip.personId);
      if (kind === 'close') { pip.status = 'Closed'; St.log('Changed', name, 'PIP closed: improved'); U.toast('PIP closed', 'ok'); }
      if (kind === 'extend') { pip.checkins.push(St.fmtShort(St.iso(St.addDays(new Date(), 30))) + ' (extended)'); St.log('Changed', name, 'PIP extended 30 days'); U.toast('PIP extended by 30 days', 'ok'); }
      if (kind === 'escalate') { pip.status = 'Escalated'; const c = openCase('Disciplinary', pip.personId, 'Poor performance after PIP (escalated from HR-07)'); U.toast('Escalated · case ' + c.no + ' opened', 'ok'); St.save(); U.go('relations'); return; }
      St.save(); A.refresh();
    }
  });

  /* ================= Discipline & grievance ================= */
  const DISC_FLOW = [['Matter reported', 'Breach of HR-02 or misconduct'], ['Investigation', 'HR-03-SOP-01: scope, evidence, interviews, findings, report'], ['Suspension?', 'Only for serious misconduct, pending investigation'], ['Notice of allegations', 'Employee informed in writing'], ['Hearing', 'Response & mitigating factors · HR-03-FRM-01'], ['Written outcome', 'Sanction filed confidentially by HR'], ['Appeal', 'Procedural unfairness or new evidence']];
  const GRIEV_FLOW = [['Informal discussion', 'Where appropriate'], ['Formal written grievance', 'HR-03-FRM-02'], ['Grievance meeting', 'Parties heard, in good faith'], ['Outcome in writing', 'Sent to the person'], ['Right of appeal', 'In writing']];
  let ER = { k: 0, sel: null };
  function openCase(type, personId, matter) {
    const pfx = type === 'Grievance' ? 'GR' : type === 'Investigation' ? 'INV' : 'DC';
    const s = S(); s.counters[pfx] = (s.counters[pfx] || 0) + 1;
    const c = { no: pfx + '-26-' + String(s.counters[pfx]).padStart(3, '0'), type, personId, opened: St.todayIso(), matter, step: type === 'Grievance' ? 1 : 0, status: 'Open', hearing: { date: '', chair: '', allegation: matter, response: '', factors: '', finding: '', sanction: '', appeal: false }, grievance: { nature: matter, desired: '', received: St.todayIso(), meeting: '', outcome: '' } };
    s.cases.unshift(c); St.log('Changed', St.nameOf(personId), type + ' case opened (confidential)', c.no); St.save();
    ER.sel = c.no; ER.k = type === 'Grievance' ? 1 : 0;
    return c;
  }
  Pages.relations = {
    title: 'Discipline & grievance',
    render() {
      const s = S(), cases = s.cases;
      const isG = ER.k === 1;
      const pool = cases.filter(c => isG ? c.type.startsWith('Grievance') : !c.type.startsWith('Grievance'));
      let c = cases.find(x => x.no === ER.sel && (isG ? x.type.startsWith('Grievance') : !x.type.startsWith('Grievance'))) || pool.find(x => x.status === 'Open') || pool[0];
      const flowDef = isG ? GRIEV_FLOW : DISC_FLOW;
      const open = cases.filter(x => x.status === 'Open');
      const h = c && c.hearing || {}, g = c && c.grievance || {};
      const hist = c ? cases.filter(x => x.personId === c.personId && x !== c) : [];
      return `
      ${header('Discipline &amp; grievance', 'HR-03 Disciplinary &amp; Grievance Policy · corrective, not punitive · fair procedure every time', `<button class="btn" onclick="A.erNew('Grievance')">Log grievance (HR-03-FRM-02)</button><button class="btn pri" onclick="A.erNew('Disciplinary')">+ Open disciplinary case</button>`)}
      <div class="dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><strong>Confidential.</strong><span style="color:#C9D2E3">Only HR and HOD HR see this area. Every view and change is logged. Cases never appear on dashboards, reports or the person's self-service.</span></div>
      ${tiles([{ l: 'Open grievances', v: open.filter(x => x.type.startsWith('Grievance')).length, s: 'Grievances in progress' }, { l: 'Open disciplinary cases', v: open.filter(x => x.type === 'Disciplinary').length, s: open.filter(x => x.hearing && x.hearing.date && x.step === 4).length + ' hearings scheduled' }, { l: 'Investigations', v: open.filter(x => x.type === 'Investigation').length, s: 'HR-03-SOP-01' }, { l: 'Appeals pending', v: open.filter(x => x.appealPending).length, s: 'Written appeals' }])}
      <section class="card" style="min-width:0">
        <div class="between" style="padding:16px 20px 4px"><h2 class="h2" style="margin:0">Case register</h2><span class="small muted">Applies to employees, interns, volunteers and management · click a case to open it</span></div>
        <div style="padding:0 8px 8px">${table(['Case no', 'Type', 'Person', 'Opened', 'Matter', 'Current step', 'Status'], cases.map(x => { const fl = x.type.startsWith('Grievance') ? GRIEV_FLOW : DISC_FLOW; return `<tr class="click ${c && x.no === c.no ? 'sel' : ''}" onclick="A.erSel('${x.no}')"><td class="m small">${x.no}</td><td style="font-weight:700">${esc(x.type)}</td><td>${esc(St.nameOf(x.personId))}</td><td class="muted nw">${St.fmtDate(x.opened)}</td><td>${esc(x.matter)}</td><td>${esc(x.status === 'Closed' ? (x.outcome || 'Closed') : (fl[x.step] || fl[fl.length - 1])[0])}</td><td>${spill(x.status)}</td></tr>`; }))}</div>
      </section>
      ${U.segs(['Disciplinary', 'Grievance'], ER.k, 'A.erTab')}
      ${c ? `
      ${U.flow((isG ? 'Grievance ' : (c.type === 'Investigation' ? 'Investigation ' : 'Disciplinary case ')) + c.no + ' · ' + St.nameOf(c.personId) + (isG ? ' · HR-03-PROC-02' : ' · HR-03-PROC-01'), flowDef.map(([t, d], i) => ({ t, d, state: c.status === 'Closed' ? 'done' : i < c.step ? 'done' : i === c.step ? 'now' : 'next' })), isG ? 'If the grievance concerns misconduct by someone else, HR may open an investigation and a separate disciplinary case.' : 'For minor matters steps 2–5 can be replaced by informal counselling or a verbal warning. Dismissal creates a 5.1 termination request (letter HR-05-LET-03).')}
      ${c.status === 'Open' ? `<div class="row"><button class="btn" onclick="A.erStep(-1)" ${c.step <= 0 ? 'disabled' : ''}>◀ Previous step</button><button class="btn pri" onclick="A.erStep(1)">Mark "${flowDef[c.step] ? flowDef[c.step][0] : ''}" done</button><button class="btn" onclick="A.erClose()">Close case</button></div>` : ''}
      ${!isG ? `<div class="grid g-2">
        <section class="card pad" style="display:flex;flex-direction:column;gap:12px">

          <div class="fg"><label class="f">Employee<input value="${U.attr(St.nameOf(c.personId))}" disabled></label><label class="f">Position<input value="${U.attr((St.person(c.personId) || {}).title || '')}" disabled></label>
          <label class="f">Date of hearing<input type="date" id="h_date" value="${h.date || ''}"></label><label class="f">Chairperson<input id="h_chair" value="${U.attr(h.chair || '')}"></label></div>

          <label class="f">Sanction (if applicable)<select id="h_sanction"><option value="">Choose…</option>${U.opts(['Informal counselling', 'Verbal warning', 'Written warning', 'Final written warning', 'Termination of employment / engagement'], h.sanction)}</select></label>

          <div class="row"><button class="btn pri" onclick="A.erHearing(true)">Save &amp; issue outcome in writing</button><button class="btn" onclick="A.erHearing(false)">Save draft</button><button class="btn" onclick="window.print()">Print for signature</button></div>
        </section>
        <div style="display:flex;flex-direction:column;gap:16px">
          <section class="card pad" style="min-width:0"><h2 class="h2">Sanctions guideline</h2>${table(['Type of offence', 'Possible sanction'], [['Minor misconduct (e.g. lateness)', 'Counselling / verbal warning'], ['Repeated minor misconduct', 'Written warning'], ['Serious misconduct', 'Final written warning'], ['Gross misconduct', 'Dismissal']].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`))}<p class="small muted" style="margin:12px 0 0">HR-03-GDL-01 · guideline only. Steps need not follow in sequence; sanctions may go up or down; earlier outcomes are not binding precedent.</p></section>
          <section class="card pad"><h2 class="h2">Person's history (confidential)</h2><div style="display:flex;flex-direction:column;gap:8px;font-size:13px">${hist.map(x => `<div class="between box" style="padding:10px 12px"><span>${esc(x.type)} · ${esc(x.outcome || x.matter)}</span><span class="muted">${St.fmtDate(x.opened)}</span></div>`).join('') || '<span class="muted">No other cases for this person.</span>'}</div><p class="small" style="margin:10px 0 0;color:var(--a)">How long a warning stays valid is not stated in HR-03. Add it to the policy before go-live.</p></section>
        </div>
      </div>` : `<div class="grid g-2">
        <section class="card pad" style="display:flex;flex-direction:column;gap:12px">
          <div class="between"><h2 class="h2" style="margin:0">Grievance form</h2><span class="m xs muted">HR-03-FRM-02 · v1.0 · ${c.no}</span></div>
          <div class="fg"><label class="f">Name<input value="${U.attr(St.nameOf(c.personId))}" disabled></label><label class="f">Department<input value="${U.attr((St.person(c.personId) || {}).dept || '')}" disabled></label></div>
          <label class="f">Nature of grievance<textarea id="g_nature">${esc(g.nature || '')}</textarea></label>
          <label class="f">Desired outcome<textarea id="g_desired">${esc(g.desired || '')}</textarea></label>
          <div class="fg"><label class="f">Date received<input type="date" id="g_received" value="${g.received || ''}"></label><label class="f">Grievance meeting<input type="date" id="g_meeting" value="${g.meeting || ''}"></label></div>
          <label class="f">Outcome (communicated in writing)<textarea id="g_outcome" placeholder="Outcome and reasons">${esc(g.outcome || '')}</textarea></label>
          <div class="row"><button class="btn pri" onclick="A.erGriev(true)">Issue written outcome</button><button class="btn" onclick="A.erGriev(false)">Save draft</button><button class="btn" onclick="A.erAppeal()">Record appeal</button></div>
        </section>
        <section class="card pad"><h2 class="h2">Protections &amp; appeals</h2><ul class="rules"><li>No victimisation or retaliation for a grievance raised in good faith, or for taking part in one.</li><li>Grievances are dealt with promptly and confidentially.</li><li>Appeals in writing, on grounds of procedural unfairness or new / material evidence.</li><li>Code of Conduct breaches reported by staff (HR-02 §6) are logged here as grievances.</li></ul><p class="small" style="margin:12px 0 0;color:var(--a)">HR-03 says "within a reasonable timeframe" for appeals and "promptly" for grievances. The system needs a number of days for each. Please confirm with HOD HR.</p></section>
      </div>`}` : `<div class="card empty">No ${isG ? 'grievances' : 'disciplinary cases'} yet.</div>`}`;
    },
    after() { if (!Pages.relations._logged) { St.log('Viewed sensitive field', '—', 'Discipline & grievance area opened'); Pages.relations._logged = true; setTimeout(() => Pages.relations._logged = false, 60000); } }
  };
  const curCase = () => { const s = S(), isG = ER.k === 1; const pool = s.cases.filter(c => isG ? c.type.startsWith('Grievance') : !c.type.startsWith('Grievance')); return s.cases.find(x => x.no === ER.sel && pool.includes(x)) || pool.find(x => x.status === 'Open') || pool[0]; };
  Object.assign(A, {
    erTab(i) { ER.k = i; ER.sel = null; A.refresh(); },
    erSel(no) { const c = S().cases.find(x => x.no === no); ER.sel = no; ER.k = c.type.startsWith('Grievance') ? 1 : 0; A.refresh(); },
    erStep(d) { const c = curCase(), max = (ER.k ? GRIEV_FLOW : DISC_FLOW).length - 1; c.step = Math.max(0, Math.min(max, c.step + d)); St.log('Changed', St.nameOf(c.personId), 'Case step → ' + (ER.k ? GRIEV_FLOW : DISC_FLOW)[c.step][0], c.no); St.save(); A.refresh(); },

    erHearing(issue) {

      A.refresh();
    },
    erGriev(issue) {
      const c = curCase(), g = c.grievance = c.grievance || {};
      ['nature', 'desired', 'received', 'meeting', 'outcome'].forEach(k => g[k] = document.getElementById('g_' + k).value);
      if (issue) { if (!g.outcome) return U.toast('Write the outcome first', 'bad'); c.step = 4; St.log('Changed', St.nameOf(c.personId), 'Grievance outcome issued in writing', c.no); U.toast('Outcome issued · right of appeal open', 'ok'); }
      else { St.log('Changed', St.nameOf(c.personId), 'Grievance form saved (draft)', c.no); U.toast('Draft saved', 'ok'); }
      St.save(); A.refresh();

    erAppeal() {

    }
  });
})();

      const alerts = [].concat(risks.filter(late).map(r => ({ id: r.id, t: St.riskLevel(r.l * r.i) + ' risk not reported to ' + reportTo(r.l * r.i) + ' in time', w: 'Reminder sent', c: 'r' })))
        .concat(risks.filter(overdue).map(r => ({ id: r.id, t: 'Action past its due date (' + St.fmtShort(r.due) + ')', w: 'Follow up with owner', c: 'a' })))
        .concat(risks.filter(r => !r.q && r.st !== 'Closed').map(r => ({ id: r.id, t: 'New risk logged · ' + St.riskLevel(r.l * r.i) + ' · ' + r.a, w: 'Add to QMS register', c: 'b', act: r.id })))
        .concat(risks.filter(r => r.st === 'Closed' && r.closed >= q0).map(r => ({ id: r.id, t: 'Closed with evidence · HOD HR approved', w: 'Closed this quarter', c: 'g' })));
      const sel = risks[RT.k] || risks[0];
      const cmap = { b: 'var(--b)', g: 'var(--g)', a: 'var(--a)', r: 'var(--r)' };
      return `
      <header class="phead"><div class="in"><div class="logo">A</div><div style="flex:1 1 220px"><div style="font-weight:800;font-size:16px">Angels Risk Tracker</div><div class="small muted">HR risks fed from PERSAL · no names or personal details</div></div><div class="small muted" style="text-align:right">Signed in as <strong style="color:var(--ink)">${esc(St.me().name)}</strong><br>Microsoft 365</div></div></header>
      <main class="pmain">
        ${header('HR risks', 'Updated whenever a risk is logged, changes level or changes status in PERSAL · linked to the QMS risk register', `<button class="btn pri" onclick="A.riskCsv()">Export quarterly report</button>`)}
        ${tiles([{ l: 'Open HR risks', v: risks.filter(r => r.st !== 'Closed').length, s: 'Not yet closed' }, { l: 'Not reported in time', v: risks.filter(late).length, s: 'Past the deadline for their level', c: 'var(--r)' }, { l: 'Actions overdue', v: risks.filter(overdue).length, s: 'Past the due date', c: 'var(--a)' }, { l: 'Closed this quarter', v: risks.filter(r => r.st === 'Closed' && r.closed >= q0).length, s: 'With evidence and approval', c: 'var(--g)' }])}
        <section class="card pad"><h2 class="h2">Alerts</h2><div style="display:flex;flex-direction:column;gap:8px">${alerts.map(a => `<div class="flag" style="background:var(--${a.c}-bg);flex-wrap:wrap"><span class="dot" style="background:var(--${a.c})"></span><span class="m small muted">${a.id}</span><span style="flex:1 1 300px">${esc(a.t)}</span>${a.act ? `<button class="btn sm" onclick="A.rtQms('${a.act}')">Add to QMS register</button>` : `<span class="small" style="font-weight:700;color:var(--${a.c})">${a.w}</span>`}</div>`).join('') || '<div class="empty">No alerts</div>'}</div></section>
        <section class="card" style="min-width:0"><div style="padding:16px 20px 4px"><h2 class="h2" style="margin:0">All HR risks · select one to see its trail</h2></div>
          <div style="padding:0 8px 8px">${table(['HR ID', 'QMS ID', 'Area', 'Level', 'Owner', 'Reported to · date', 'Action due', 'Status', ''], risks.map((r, i) => `<tr class="${i === RT.k ? 'sel' : ''}"><td class="m small">${r.id}</td><td class="m small muted">${r.q || '—'}</td><td>${esc(r.a)}</td><td>${lvPill(St.riskLevel(r.l * r.i))}</td><td>${esc(r.o)}</td><td class="small" style="color:${late(r) ? 'var(--r)' : 'var(--ink2)'}">${r.reported ? reportTo(r.l * r.i) + ' · ' + St.fmtShort(r.reported) + ' ✓' : late(r) ? 'Not reported · late' : 'Not yet'}</td><td class="small" style="color:${overdue(r) ? 'var(--r)' : 'var(--ink2)'}">${r.st === 'Closed' ? 'Done' : r.due ? St.fmtShort(r.due) + (overdue(r) ? ' · overdue' : '') : '—'}</td><td>${pill(r.st, 'x')}</td><td><button class="btn sm" onclick="A.rtSel(${i})">Trail</button></td></tr>`))}</div></section>
        <div class="grid g-2">
          <section class="card pad" style="min-width:0"><h2 class="h2">Trail · ${sel.id} · ${esc(sel.a)}</h2><div class="tl">${(sel.trail || []).map(e => `<div><span class="dot" style="background:${cmap[e.c] || 'var(--b)'}"></span><div style="flex:1"><div style="font-size:14px;font-weight:700">${esc(e.t)}</div><div class="small muted">${/^\d{4}-/.test(e.d) ? St.fmtDate(e.d) : esc(e.d)} · ${esc(e.b)}</div></div></div>`).join('')}${sel.st !== 'Closed' ? `<div><span class="dot" style="background:#C9D0DC"></span><div class="small muted">Closure: waiting for evidence and approval</div></div>` : ''}</div></section>
          <section class="card pad" style="display:flex;flex-direction:column;gap:8px;font-size:14px"><h2 class="h2" style="margin:0 0 6px">How the tracker works</h2><span>1. A new HR risk, a level change or a status change reaches you here and by email or Teams the same day.</span><span>2. You give it a QMS ID in the QMS risk register; both registers stay linked.</span><span>3. You are warned when a risk is not reported in time (Critical: immediately; High: 48 hours; Medium: 5 working days), or when a review or action is overdue.</span><span>4. A risk shows Closed only after the owner’s closure note, an evidence reference and HOD HR approval (CEO too for High and Critical).</span><span>5. Closed risks stay on the quarterly report for one more quarter as “closed this quarter”.</span><span class="small muted" style="margin-top:4px">Quarterly report goes to HOD Operations and Systems [to confirm].</span></section>
        </div>
      </main>`;
    }
  };
  Object.assign(A, {
    rtSel(i) { RT.k = i; A.refresh(); },
    rtQms(id) { const r = S().risks.find(x => x.id === id); const n = S().risks.filter(x => x.q).length + 14; r.q = 'QMS-R' + String(n + 1).padStart(3, '0'); riskTrail(r, 'Alert received · ' + r.q + ' created', 'b'); St.log('Changed', '—', id + ' linked to ' + r.q, id); St.save(); U.toast(id + ' linked to ' + r.q, 'ok'); A.refresh(); }
  });
})();

</script>
<script>/* js/app.js */
/* Angels PERSAL — start-up, installable app (PWA) support */
(function () {
  Store.load();
  window.addEventListener('hashchange', () => UI.render());
  window.addEventListener('storage', e => { if (e.key === 'angels-persal-v1') { Store.load(); UI.render(); } });
  if (!location.hash) history.replaceState(null, '', '#/' + UI.homeFor(Store.S.role));

  /* ---------- install as an app ---------- */
  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  let deferred = null;
  window.Install = {
    available: () => !standalone(),
    installed: standalone,
    async prompt() {
      if (deferred) {
        deferred.prompt();
        const r = await deferred.userChoice; deferred = null;
        if (r.outcome === 'accepted') UI.toast('Angels PERSAL is being installed', 'ok');
        UI.render(); return;
      }
      const steps = isIOS
        ? '<ol style="margin:0;padding-left:20px;line-height:1.8"><li>Open this page in <strong>Safari</strong>.</li><li>Tap the <strong>Share</strong> button (square with an arrow).</li><li>Tap <strong>Add to Home Screen</strong>, then <strong>Add</strong>.</li></ol>'
        : /Android/.test(ua)
          ? '<ol style="margin:0;padding-left:20px;line-height:1.8"><li>Open this page in <strong>Chrome</strong>.</li><li>Tap the <strong>⋮</strong> menu (top right).</li><li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</li></ol>'
          : '<ol style="margin:0;padding-left:20px;line-height:1.8"><li>Open this page in <strong>Chrome</strong> or <strong>Edge</strong>.</li><li>Click the <strong>install icon</strong> at the right of the address bar (a screen with a down arrow), or open the browser menu → <strong>Install Angels PERSAL</strong> / <strong>Apps → Install this site as an app</strong>.</li></ol>';
      UI.modal('Install Angels PERSAL', `<p style="margin:0">Add the app to your home screen or desktop. It opens in its own window, works full-screen on phones and tablets, and keeps working without signal.</p>${steps}<p class="small muted" style="margin:0">The app needs to be opened from the web address (https), not from a file on your computer.</p>`);
    }
  };
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; UI.render(); });
  window.addEventListener('appinstalled', () => { deferred = null; UI.toast('Installed — find Angels PERSAL on your home screen', 'ok'); UI.render(); });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ });
  }

  UI.render();
})();

</script>
</body>
</html>
