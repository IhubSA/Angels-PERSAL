        <div style="flex:1 1 260px">
          <div class="row"><h1 style="margin:0;font-size:26px;font-weight:800">${esc(St.fullName(p))}</h1>${spill(p.status)}${pill(p.cat, 'b')}</div>
          <div class="muted" style="margin-top:6px">${esc(p.title)} · ${esc(p.dept)}${p.placedWith && p.placedWith !== 'Angels' ? ' · ' + esc(p.placedWith) : ''} · direct manager: ${p.dm ? `<a href="#/person/${p.dm}">${esc(St.nameOf(p.dm))}</a>` : (p.id === 'p1' ? 'Board Chair' : 'n/a')}${p.fm ? ' · functional manager: ' + esc(p.fm) : ''}</div>
          <div class="m small muted" style="margin-top:6px">PERSAL ${p.persal || '[not issued]'} · POST ${p.postNo || '—'} · ${post ? post.cc : '—'}</div>
        </div>
        <div class="row">
          ${isHR ? `<button class="btn" onclick="A.editContact('${p.id}')">Update contact details</button><a class="btn" href="#/documents/${p.id}">Upload document</a>` : ''}
          <button class="btn pri" onclick="A.newRequest(null,'${p.id}')">+ New request</button>
        </div>
      </section>
      <div class="grid g-2">
        <section class="card pad" style="display:flex;flex-direction:column;gap:12px">
          <div class="between"><h2 class="h2" style="margin:0">PERSAL number</h2>${p.persal ? pill('Issued · locked', 'g') : pill('Waiting for approval', 'a')}</div>
          <div class="m" style="font-size:32px;letter-spacing:.08em">${p.persal || '[not issued]'}</div>
          <div class="row">
            ${!p.persal && r === 'hodhr' ? `<button class="btn pri" onclick="A.genPersal('${p.id}')">Generate PERSAL number</button>` : ''}
            <button class="btn" onclick="A.toggleCheck()">Check a number</button>
          </div>
          ${showCheck ? `<label class="f">Type any PERSAL number<input class="m" inputmode="numeric" maxlength="8" value="${chk}" oninput="A.chk(this)"></label><div id="chkMsg" style="font-size:13px;font-weight:700">${chkMsg()}</div>` : ''}
          <ul class="small muted" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
            <li>8 digits: 7 random digits (never starting with 0) plus a check digit (Luhn), so typing errors are caught.</li>
            <li>Not sequential and not based on ID number, start date or name, so it cannot be guessed.</li>
            <li>Issued automatically when an appointment or agreement request (2.2 / 2.3) is approved; checked against every number ever issued.</li>
            <li>Never changed and never reused, even after someone leaves. Suppliers get no number.</li>
          </ul>
        </section>
        <section class="card pad"><h2 class="h2">Personal details</h2>
          <dl class="kv">
            <div><dt>ID / passport</dt><dd>${sens('id', p.idNo, 'ID number')}</dd></div>
            <div><dt>Date of birth</dt><dd>${p.idNo && p.idNo.length === 13 ? (rv('id') ? '19' + p.idNo.slice(0, 2) + '-' + p.idNo.slice(2, 4) + '-' + p.idNo.slice(4, 6) : '••••-••-••') : '—'}</dd></div>
            <div><dt>Income tax no</dt><dd>${sens('tax', p.taxNo, 'Tax number')}</dd></div>
            <div><dt>Cell</dt><dd>${esc(p.cell || '—')}</dd></div>
            <div><dt>Email</dt><dd>${esc(p.email || '—')}</dd></div>
            <div><dt>Next of kin</dt><dd>${esc(p.kin || '—')}</dd></div>
            <div><dt>Staff category</dt><dd>${esc(p.cat)}</dd></div>
            <div><dt>Paid through</dt><dd>${esc(St.PAID[p.cat] || 'SimplePay payroll')}</dd></div>
            <div><dt>Attendance</dt><dd>${esc(p.attendance || '—')}</dd></div>
            <div><dt>PERSAL number</dt><dd class="m">${p.persal || '—'}</dd></div>
            <div class="full"><dt>Address</dt><dd>${esc(p.address || '—')}</dd></div>
          </dl>
        </section>
        <section class="card pad"><h2 class="h2">Appointment &amp; reviews</h2>
          <dl class="kv" style="margin-bottom:14px">
            <div><dt>Employment start (first day worked)</dt><dd>${St.fmtDate(p.start)}</dd></div>
            <div><dt>Contract signed</dt><dd>${St.fmtDate(p.signed)}</dd></div>
            <div><dt>Type</dt><dd>${esc(p.cat)}${p.endDate ? ' · ends ' + St.fmtDate(p.endDate) : ' · no end date'}</dd></div>
            <div><dt>Probation</dt><dd>${esc(p.probation || '—')}</dd></div>

            <div><dt>Long-service leave (5 years)</dt><dd>From ${St.fmtDate(St.iso(St.addDays(new Date(p.start + 'T00:00:00'), 365 * 5 + 1)))}</dd></div>
            ${p.status === 'Exited' ? `<div class="full"><dt>Exit</dt><dd>${esc(p.exitReason || '')} · last day ${St.fmtDate(p.exitDate)}</dd></div>` : ''}
          </dl>
          <div class="row" style="gap:6px">${['d30', 'd60', 'd90'].map(k => p.reviews && p.reviews[k] ? pill(k.slice(1) + '-day ✓', 'g') : `<button class="pill a" style="border:0;cursor:pointer" title="Mark as done" onclick="A.markReview('${p.id}','${k}')">${k.slice(1)}-day due</button>`).join('')}${pill('Annual review due Mar 2027', 'a')}</div>
        </section>
        <section class="card pad">

      if (r.id_number) ids[r.id_number] = 1;

        ${ending.length ? ending.map(p => `<div class="between" style="background:#fff;border-radius:10px;padding:8px 12px"><span><strong>${esc(St.fullName(p))}</strong> · ${esc(p.cat)} · ends ${St.fmtDate(p.endDate)}</span><span class="row"><button class="btn sm" onclick="A.newRequest('2.3','${p.id}')">Renew (2.3)</button><button class="btn sm" onclick="A.newRequest('5.1','${p.id}')">Start exit</button></span></div>`).join('') : '<span class="muted">No agreements end in the next 60 days.</span>'}
      </section>`;
    }
  };
  Object.assign(A, {
    lcTab(i) { LC.k = i; LC.id = null; A.refresh(); },
    lcPick(id) { LC.id = id; A.refresh(); },
    lcTask(id, i, st) { const l = S().lifecycle.find(x => x.id === id); l.tasks[i].st = st; St.log('Changed', St.nameOf(l.personId), l.kind + ' task "' + l.tasks[i].t + '" → ' + st); St.save(); A.refresh(); }
  });

  /* ================= Documents ================= */
  let DC = { c: 0, person: '' };
  const CHECKLISTS = [
    { name: 'Employees', cats: St.EMPLOYEE_CATS, req: [['Signed offer letter (HR-05-LET-01)', 'Before start', 'Offer letter'], ['Contract of employment (HR-05-CON-01)', 'Before start', 'Signed contract / SLA'], ['Certified ID copy', 'Before start', 'Certified ID copy'], ['CV & qualifications', 'Before start', 'Qualifications'], ['Code of Conduct acknowledgement (HR-02-ACK-01)', 'At induction', 'Code of Conduct acknowledgement'], ['Leave Policy acknowledgement (HR-06-ACK-01)', 'At induction', 'Leave Policy acknowledgement'], ['Legacy leave forms, scanned (PERSALno_LEAVE_YYYY-MM-DD)', 'Before leave cut-over'], ['POPIA consent', 'Before start', 'POPIA consent'], ['Bank confirmation letter', 'Before first pay', 'Bank confirmation letter'], ['Tax number proof', 'Before first pay', 'Tax number proof'], ['KPAs agreed and signed (HR-07)', 'Before review period'], ['Probation outcome letter (HR-05-LET-02)', 'End of probation']] },
    { name: 'Volunteers', cats: ['Volunteer'], req: [['Volunteer agreement (HR-04-MAN-01)', 'Before start', 'Signed contract / SLA'], ['Certified ID copy', 'Before start', 'Certified ID copy'], ['Safeguarding screening', 'Before start'], ['Code of Conduct acknowledgement (HR-02-ACK-01)', 'At induction', 'Code of Conduct acknowledgement'], ['POPIA consent', 'Before start', 'POPIA consent'], ['Volunteer induction checklist', 'First week'], ['Volunteer exit / off-boarding checklist', 'On exit']] },
    { name: 'Mentors (SLA · project period)', cats: ['Contract (SLA)'], req: [['Certified ID copy', 'Before start', 'Certified ID copy'], ['CV & qualifications', 'Before start', 'Qualifications'], ['Signed SLA', 'Before start', 'Signed contract / SLA'], ['MoA with funder', 'Before start', 'MoA'], ['POPIA consent', 'Before start', 'POPIA consent'], ['Bank confirmation letter', 'Before first payment', 'Bank confirmation letter'], ['Monthly activity report', 'Monthly']] },
    { name: 'Interns (client-based · 18 months)', cats: ['Intern', 'Social Performance intern'], req: [['Certified ID copy', 'Before start', 'Certified ID copy'], ['Latest qualification', 'Before start', 'Qualifications'], ['Safeguarding screening (HR-04-INT §7)', 'Before placement'], ['Client placement confirmation', 'Before placement'], ['Code of Conduct acknowledgement (HR-02-ACK-01)', 'At induction', 'Code of Conduct acknowledgement'], ['Signed internship agreement', 'Before start', 'Signed contract / SLA'], ['POPIA consent', 'Before start', 'POPIA consent'], ['Bank confirmation letter', 'Before first stipend', 'Bank confirmation letter'], ['Mentor review forms', '30 / 60 / 90 days']] },
    { name: 'Bursary holders', cats: ['Bursary holder'], req: [['Certified ID copy', 'Before award', 'Certified ID copy'], ['Proof of registration', 'Each semester'], ['Signed bursary agreement', 'Before award', 'Signed contract / SLA'], ['Academic results', 'Each semester'], ['POPIA consent', 'Before award', 'POPIA consent'], ['Bank confirmation letter', 'Before first payment', 'Bank confirmation letter']] }
  ];
  Pages.documents = {
    title: 'Documents',
    render(pid) {
      if (pid && pid !== DC.person) { DC.person = pid; const p = St.person(pid); if (p) DC.c = Math.max(0, CHECKLISTS.findIndex(c => c.cats.includes(p.cat))); }
      const p = St.person(DC.person), cl = CHECKLISTS[DC.c];
      const have = t => p && t ? S().docs.filter(d => d.personId === p.id && d.type === t).map(d => d.status) : [];
      const ups = S().docs.slice().sort((a, b) => b.when.localeCompare(a.when));
      const toVerify = ups.filter(d => d.status === 'To verify').length;
      return `
      ${header('Documents', "Every upload lands on the person's file, gets a document code and is verified by HR before it counts")}
      <div class="grid g-2">
        <section class="card pad" style="display:flex;flex-direction:column;gap:14px">
          <h2 class="h2" style="margin:0">Upload</h2>
          <label class="drop" id="docDrop"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            <span style="font-size:16px;font-weight:800" id="docFileLbl">Drag files here or click to browse</span><span class="small muted">PDF, JPG or PNG · up to 10 MB each · several files at once</span>
            <input type="file" id="docFiles" multiple accept=".pdf,.jpg,.jpeg,.png" onchange="A.docPicked(this)"></label>
          <div class="fg">
            <label class="f">Person<select id="docPerson" onchange="A.docPerson(this.value)"><option value="">Choose a person…</option>${U.peopleOpts(DC.person, () => true)}</select></label>
            <label class="f">Document type<select id="docType">${U.opts(St.DOC_TYPES)}</select></label>
            <label class="f">Valid until (if any)<input type="date" id="docValid"></label>
            <label class="f">Linked request (optional)<input id="docLink" placeholder="PR-26-____"></label>
          </div>
          <button class="btn pri" style="align-self:flex-start" onclick="A.docUpload()">Upload to file</button>
          <p class="small muted" style="margin:0">Files are renamed automatically: <span class="m">HR-[TYPE]-[PERSAL]-v01</span>. A new upload of the same type becomes the next version; old versions are kept, never overwritten. <em>Test system: only the file name is stored, not the file itself.</em></p>
        </section>
        <section class="card pad" style="display:flex;flex-direction:column;gap:12px;min-width:0">
          <h2 class="h2" style="margin:0">Required documents checklist${p ? ' · ' + esc(St.fullName(p)) : ''}</h2>
          <div class="tabs">${CHECKLISTS.map((c, i) => `<button class="${i === DC.c ? 'on' : ''}" onclick="A.docCl(${i})">${esc(c.name)}</button>`).join('')}</div>
          <div>${cl.req.map(([n, when, type]) => { const h = have(type); const st = !p ? '' : !type ? pill('Track manually', 'x') : h.includes('Verified') ? pill('On file', 'g') : h.includes('To verify') ? pill('To verify', 'a') : pill('Missing', 'r'); return `<div class="list-row" style="align-items:center;font-size:14px"><span style="font-weight:600">${esc(n)}</span><span class="row" style="gap:8px"><span class="small muted">${esc(when)}</span>${st}</span></div>`; }).join('')}</div>
          ${!p ? '<p class="small muted" style="margin:0">Choose a person on the left to see what is on their file.</p>' : ''}
        </section>
      </div>
      <section class="card" style="min-width:0">
        <div class="between" style="padding:16px 20px 4px"><h2 class="h2" style="margin:0">Recent uploads</h2>${pill(toVerify + ' waiting for verification', toVerify ? 'a' : 'g')}</div>
        <div style="padding:0 8px 8px">${table(['Document code', 'Type', 'Person', 'Uploaded', 'By', 'Source', 'Status', ''], ups.map(d => `<tr><td class="m small nw">${esc(d.code)}</td><td style="font-weight:700">${esc(d.type)}</td><td>${d.personId ? `<a href="#/person/${d.personId}">${esc(St.nameOf(d.personId))}</a>` : esc(d.personName || '—')}</td><td class="muted nw">${St.fmtDate(d.when)}</td><td>${esc(d.by)}</td><td>${esc(d.src)}</td><td>${spill(d.status)}</td><td class="nw">${d.status === 'To verify' ? `<button class="link" onclick="A.docVerify('${d.code}',true)">Verify</button> · <button class="link" style="color:var(--r)" onclick="A.docVerify('${d.code}',false)">Reject</button>` : ''}</td></tr>`))}</div>
      </section>`;
    },
    after() {
      const d = document.getElementById('docDrop'); if (!d) return;
      ['dragenter', 'dragover'].forEach(e => d.addEventListener(e, ev => { d.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(e => d.addEventListener(e, () => d.classList.remove('over')));
    }
  };
  Object.assign(A, {
    docCl(i) { DC.c = i; A.refresh(); },
    docPerson(id) { DC.person = id; const p = St.person(id); if (p) DC.c = Math.max(0, CHECKLISTS.findIndex(c => c.cats.includes(p.cat))); A.refresh(); },
    docPicked(inp) { const fs = [...inp.files]; const big = fs.filter(f => f.size > 10 * 1024 * 1024); if (big.length) { U.toast(big[0].name + ' is larger than 10 MB', 'bad'); inp.value = ''; return; } document.getElementById('docFileLbl').textContent = fs.length ? fs.map(f => f.name).join(', ') : 'Drag files here or click to browse'; },
    docUpload() {
      const files = [...document.getElementById('docFiles').files]; const pid = document.getElementById('docPerson').value, type = document.getElementById('docType').value;
      if (!pid) return U.toast('Choose the person first', 'bad');
      if (!files.length) return U.toast('Choose at least one file', 'bad');
      const p = St.person(pid);
      files.forEach(f => {
        const prev = S().docs.filter(d => d.personId === pid && d.type === type).length;
        const code = 'HR-' + (St.DOC_CODE[type] || 'DOC') + '-' + (p.persal || p.id.toUpperCase()) + '-v' + String(prev + 1).padStart(2, '0');
        S().docs.unshift({ code, type, personId: pid, when: St.todayIso(), by: St.me().label.replace(/ \(.*\)/, ''), src: 'Upload', status: 'To verify', validUntil: document.getElementById('docValid').value, linked: document.getElementById('docLink').value.trim(), fileName: f.name });
        St.log('Changed', St.fullName(p), 'Document uploaded: ' + type + ' (' + f.name + ')', code);
      });
      St.save(); U.toast(files.length + ' document(s) added · waiting for verification', 'ok'); A.refresh();
    },
    docVerify(code, ok) {
      const d = S().docs.find(x => x.code === code);
      if (ok) { d.status = 'Verified'; St.log('Approved', d.personId ? St.nameOf(d.personId) : d.personName, 'Document verified: ' + d.type, code); St.save(); A.refresh(); return; }
      U.modal('Reject document', `<label class="f">Reason (shown on the file)<input name="why" placeholder="e.g. unclear copy, expired, wrong person"></label>`, [{ label: 'Cancel' }, { label: 'Reject', cls: 'bad', onClick: m => { if (!U.need(m, ['why'])) return false; d.status = 'Rejected · ' + U.val(m, 'why'); St.log('Declined', d.personId ? St.nameOf(d.personId) : d.personName, 'Document rejected: ' + U.val(m, 'why'), code); St.save(); A.refresh(); } }]);
    }
  });
})();

</script>
<script>/* js/pages/requests.js */
/* Requests & approvals · request detail · new request form · payroll instructions */
(function () {
  const St = window.Store, U = window.UI, { esc, pill, spill, header, tiles, table, Pages } = U;
  const S = () => St.S;
  const short = c => St.code(c).t.split(' · ')[0];
  const stageOf = r => r.status === 'Pending' ? St.STEP_LABEL[(St.currentStep(r) || {}).role] || '—' : r.status;

  /* ================= Approvals list ================= */
  let AP = { tab: 0 };
  Pages.approvals = {
    title: 'Approvals',
    render() {
      const all = S().requests;
      const sets = [
        ['Waiting for me', all.filter(r => St.canAct(r))],
        ['All pending', all.filter(r => r.status === 'Pending')],
        ['Returned', all.filter(r => r.status === 'Returned')],
        ['Approved', all.filter(r => r.status === 'Approved')],
        ['Declined', all.filter(r => r.status === 'Declined')],
        ['All', all]
      ];
      const [, list] = sets[AP.tab];
      const me = St.me();
      return `
      ${header('Requests &amp; approvals', 'Every change to a person, post or pay goes through a request. Approved = record. Records are never edited, only reversed by a new request.', S().role !== 'board' ? `<button class="btn pri" onclick="A.newRequest()">+ New request</button>` : '')}
      <div class="info">You are testing as <strong>${esc(me.name)} · ${esc(me.label)}</strong>. Requests at your step show an Approve button. Switch the test role in the sidebar to move a request along its route.</div>
      ${U.segs(sets.map(s => s[0] + ' · ' + s[1].length), AP.tab, 'A.apTab')}
      <section class="card" style="min-width:0;padding:6px 8px">
        ${table(['Reference', 'Request', 'Person', 'Submitted', 'Effective', 'Stage', ''], list.map(r => `<tr class="click" onclick="location.hash='#/request/${r.no}'"><td class="m small muted nw">${r.no}</td><td><div style="font-weight:700">${esc(short(r.code))}</div><div class="xs muted m">CODE ${r.code}</div></td><td>${esc(St.subjectLabel(r))}</td><td class="muted nw">${St.fmtShort(r.submitted)}</td><td class="muted nw">${St.fmtShort(r.effective)}</td><td>${r.status === 'Pending' ? pill(stageOf(r), St.canAct(r) ? 'a' : 'b') : spill(r.status)}${r.reversedBy ? ' ' + pill('Reversed', 'x') : ''}</td><td class="nw">${St.canAct(r) ? pill('Waiting for you', 'a') : ''}</td></tr>`), { empty: AP.tab === 0 ? 'Nothing is waiting for you. Switch the test role to see other people’s queues.' : 'No requests here.' })}
      </section>
      ${codesTable()}`;
    }
  };
  function codesTable() {
    return `<section class="card pad" style="min-width:0"><h2 class="h2">Request types</h2>${table(['Code', 'Request', 'Who it applies to', 'Approval route', 'Payroll effect'], St.CODES.map(c => `<tr><td class="m small muted">${c.c}</td><td style="font-weight:700">${esc(c.t)}</td><td>${esc(c.a)}</td><td class="small">${c.route.map(r => St.STEP_LABEL[r]).join(' → ')}</td><td class="small muted">${esc(c.p)}</td></tr>`))}
      <p class="small muted" style="margin:12px 0 0">Leave applications (3.1) go through the leave portal: self → direct manager. HODs → CEO; CEO → Board Chair or Treasurer. Escalates after 3 working days.</p></section>`;
  }
  A.apTab = i => { AP.tab = i; A.refresh(); };

  /* ================= Request detail ================= */
  Pages.request = {
    title: 'Request', nav: 'approvals',
    render(no) {
      const r = S().requests.find(x => x.no === no);
      if (!r) return `<div class="card pad">Request ${esc(no)} not found. <a href="#/approvals">Back to approvals</a></div>`;
      const c = St.code(r.code), p = r.personId ? St.person(r.personId) : null, d = r.data || {};
      const can = St.canAct(r), cur = St.currentStep(r);
      const badge = r.status === 'Pending' ? (can ? pill('Waiting for you', 'a') : pill('With ' + St.STEP_LABEL[cur.role], 'b')) : spill(r.status);
      const post = p ? St.postOf(p.postNo) : (d.postNo ? St.postOf(d.postNo) : null);
      const changes = changeRows(r, p);
      const nextRole = cur ? r.route[r.route.indexOf(cur) + 1] : null;
      const approveLabel = cur && cur.role === 'manager' ? "Record manager's support" : nextRole ? 'Approve and send to ' + St.STEP_LABEL[nextRole.role] : 'Give final approval';
      return `
      <div class="crumb"><a href="#/approvals">Approvals</a> › ${r.no}</div>
      <div class="ph"><div><h1 style="font-size:26px">${esc(short(r.code))} · ${esc(St.subjectLabel(r))}</h1><p class="m small" style="margin-top:6px">${r.no} · CODE ${r.code} · SUBMITTED ${St.fmtDate(r.submitted).toUpperCase()}</p></div>${badge}</div>
      ${U.flow('Approval route', r.route.map(s => ({ t: St.STEP_LABEL[s.role], d: s.state === 'done' ? (s.by || '') + (s.at ? ' · ' + St.fmtShort(s.at) : '') : s.state === 'returned' ? 'Returned: ' + (s.comment || '') : s.state === 'declined' ? 'Declined: ' + (s.comment || '') : St.STEP_WHO[s.role], state: s.state === 'returned' || s.state === 'declined' ? 'now' : s.state })),
        'If the CEO submits a request or is the subject of it, final approval goes to the Board Treasurer (Jim). Nobody can approve their own request. Direct managers have no PERSAL login: they support non-leave requests on the form or by email, and HR captures it.')}
      <div class="grid g-2">
        <section class="card pad"><h2 class="h2">Details</h2>
          <dl style="margin:0;display:grid;grid-template-columns:140px 1fr;gap:10px 14px;font-size:14px">
            <dt class="small muted" style="font-weight:700">Person</dt><dd style="margin:0">${p ? `<a href="#/person/${p.id}" style="font-weight:700">${esc(St.fullName(p))}</a>` : esc(r.subjectName || '—')}</dd>
            <dt class="small muted" style="font-weight:700">Post</dt><dd style="margin:0">${post ? esc(post.title) + ' · ' + post.no : '—'}</dd>
            <dt class="small muted" style="font-weight:700">Cost centre</dt><dd style="margin:0">${post ? post.cc + ' · ' + esc(post.funder) : '—'}</dd>
            <dt class="small muted" style="font-weight:700">Effective</dt><dd style="margin:0">${St.fmtDate(r.effective)}</dd>
            <dt class="small muted" style="font-weight:700">Motivation</dt><dd style="margin:0">${esc(r.motivation || '—')}</dd>
            <dt class="small muted" style="font-weight:700">Payroll effect</dt><dd style="margin:0">${esc(c.p)}</dd>
            ${r.effect ? `<dt class="small muted" style="font-weight:700">Result</dt><dd style="margin:0">${pill(r.effect, 'g')}</dd>` : ''}
            ${r.reversedBy ? `<dt class="small muted" style="font-weight:700">Reversed by</dt><dd style="margin:0"><a href="#/request/${r.reversedBy}">${r.reversedBy}</a></dd>` : ''}
          </dl>
        </section>
        <section class="card pad" style="min-width:0"><h2 class="h2">What changes</h2>
          ${table(['Field', 'Now', 'New'], changes.map(x => `<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td style="font-weight:800">${esc(x[2])}</td></tr>`), { empty: 'No field changes — see motivation.' })}
          ${['4.2', '4.3', '2.2', '1.1', '4.5'].includes(r.code) ? `<div style="margin-top:12px;font-size:13px;padding:10px 12px;border-radius:10px;background:var(--g-bg);color:var(--g);font-weight:700">${post ? 'Cost centre ' + post.cc + ' · ' : ''}Head of Finance confirms the budget at the finance step</div>` : ''}
        </section>
      </div>
      ${r.status === 'Returned' ? `<section class="card pad" style="border-color:#E8A39C"><h2 class="h2">Returned for revision</h2><p style="margin:0 0 12px">${esc(r.returnComment || '')}</p>${['hradmin', 'hodhr'].includes(S().role) ? `<label class="f">What did you change?<textarea id="resub" placeholder="e.g. Proof of registration attached"></textarea></label><div class="row" style="margin-top:10px"><button class="btn pri" onclick="A.resubmit('${r.no}')">Resubmit</button></div>` : '<p class="small muted" style="margin:0">HR resubmits returned requests.</p>'}</section>` : ''}
      ${can ? `<section class="card pad" style="display:flex;flex-direction:column;gap:12px">
        <h2 class="h2" style="margin:0">Your decision</h2>
        <label class="f">Comment (required to return or decline)<textarea id="decComment" placeholder="Add a comment…"></textarea></label>
        <div class="row"><button class="btn ok" onclick="A.decide('${r.no}','approve')">${approveLabel}</button><button class="btn warn" onclick="A.decide('${r.no}','return')">Return for revision</button><button class="btn bad" onclick="A.decide('${r.no}','decline')">Decline</button></div>
      </section>` : r.status === 'Pending' ? `<div class="info">This request is with <strong>${St.STEP_LABEL[cur.role]}</strong>. ${cur.role === 'manager' ? 'Switch the test role to HR Administrator to capture the manager’s support.' : 'Switch the test role to ' + St.STEP_LABEL[cur.role] + ' to act on it.'}${St.ROLES[S().role].personId && St.ROLES[S().role].personId === r.personId ? ' You cannot approve a request about yourself.' : ''}</div>` : ''}
      ${r.status === 'Approved' && !r.reversedBy && r.code !== '9.9' && ['hodhr', 'hradmin'].includes(S().role) ? `<div><button class="btn bad" onclick="A.newRequest('9.9','${r.personId || ''}',{reverses:'${r.no}'})">Reverse this request (9.9)</button></div>` : ''}
      <section class="card pad"><h2 class="h2">Trail</h2><div class="tl">${S().audit.filter(a => a.ref === r.no).map(a => `<div><span class="dot"></span><div><div style="font-weight:700">${esc(a.detail)}</div><div class="small muted">${St.fmtTime(a.at)} · ${esc(a.who)} · ${esc(a.role)}</div></div></div>`).join('') || '<div class="empty">No trail entries yet</div>'}</div></section>`;
    }
  };
  function changeRows(r, p) {
    const d = r.data || {}, rows = [];
    switch (r.code) {
      case '4.2': rows.push(['Level / step', p ? p.level + ' · step ' + p.step : '—', (p ? p.level : '') + ' · step ' + (d.newStep || (p && p.step))]); if (p) { rows.push(['Monthly salary', St.money(p.salary), St.money(d.newSalary)]); const pct = p.salary ? ((d.newSalary - p.salary) / p.salary * 100) : 0; rows.push(['Change', '—', pct.toFixed(1) + ' %'], ['Annual cost impact', '—', St.money((d.newSalary - p.salary) * 12)]); } break;
      case '4.3': rows.push(['Level', p ? p.level : '—', d.newLevel], ['Step', p ? p.step : '—', d.newStep], ['Monthly salary', p ? St.money(p.salary) : '—', St.money(d.newSalary)]); break;
      case '4.9': rows.push(['Bank', p ? p.bank : '—', d.bank], ['Account', p && p.acct ? '•••• ' + p.acct.slice(-4) : '—', d.acct ? '•••• ' + String(d.acct).slice(-4) : '']); break;
      case '2.2': rows.push(['Person', '—', (d.first || '') + ' ' + (d.last || '') || St.subjectLabel(r)], ['Post', '—', d.postNo || (p && p.postNo)], ['Category', '—', d.cat || (p && p.cat)], ['Starting step', '—', 'Step ' + (d.step || 1)], ['Monthly salary', '—', St.money(d.salary)], ['PERSAL number', '—', 'Issued on final approval']); break;
      case '2.3': rows.push(['Agreement', '—', d.action], ['End date', p ? St.fmtDate(p.endDate) : '—', St.fmtDate(d.endDate)]); break;
      case '2.4': rows.push(['Probation', p ? p.probation : '—', d.outcome + (d.until ? ' to ' + St.fmtDate(d.until) : '')]); break;
      case '3.4': rows.push(['Leave', '—', d.type + ' ' + St.fmtShort(d.from) + '–' + St.fmtShort(d.to) + ' (' + St.workingDays(d.from, d.to) + ' days)']); break;
      case '3.6': rows.push([d.type + ' balance', p ? p.leave[St.leaveKey(d.type)] : '—', p ? St.round2(p.leave[St.leaveKey(d.type)] + Number(d.days)) : d.days]); break;
      case '3.7': rows.push(['Closure ' + d.y, '—', St.fmtDate(d.from) + ' – ' + St.fmtDate(d.to)], ['Leave days per employee', '—', St.workingDays(d.from, d.to)]); break;
      case '3.8': rows.push(['Unpaid days', '—', d.days], ['Leave', '—', d.leaveNo]); break;
      case '4.5': rows.push(['Once-off payment', '—', St.money(d.amount)]); break;
      case '5.1': rows.push(['Status', p ? p.status : '—', 'Exited'], ['Reason', '—', d.reason], ['Last working day', '—', St.fmtDate(d.lastDay)], ['Leave payout (annual days)', '—', p ? Math.max(0, p.leave.annual) : '—']); break;
      case '5.2': rows.push(['Status', p ? p.status : '—', 'Suspended']); break;
      case '1.1': if (d.action === 'Fund') rows.push(['Post ' + d.postNo, 'Unfunded', 'Vacant funded · ' + (d.funder || '')]); else if (d.action === 'Close') rows.push(['Post ' + d.postNo, 'Open', 'Closed']); else rows.push(['Post title', '—', d.title], ['Department', '—', d.dept], ['Level', '—', d.level], ['Cost centre / funder', '—', d.cc + ' · ' + d.funder], ['Funded', '—', d.funded ? 'Yes' : 'No']); break;
      case '9.9': rows.push(['Request', d.reverses, 'Reversed']); break;
    }
    return rows;
  }
  Object.assign(A, {
    decide(no, dec) {
      const r = S().requests.find(x => x.no === no); const c = document.getElementById('decComment').value.trim();
      if (dec !== 'approve' && !c) return U.toast('A comment is required to return or decline', 'bad');
      St.decide(r, dec, c);
      U.toast(dec === 'approve' ? (r.status === 'Approved' ? 'Final approval given · ' + (r.effect || 'recorded') : 'Approved · sent to ' + St.STEP_LABEL[St.currentStep(r).role]) : dec === 'return' ? 'Returned for revision' : 'Declined', dec === 'approve' ? 'ok' : '');
      A.refresh();
    },
    resubmit(no) { const r = S().requests.find(x => x.no === no); St.resubmit(r, (document.getElementById('resub') || {}).value); U.toast('Resubmitted', 'ok'); A.refresh(); }
  });

  /* ================= New request form ================= */
  const FIELDS = {
    post: (pre) => {
      if (pre.fundPost) { const ps = St.postOf(pre.fundPost); return `<input type="hidden" name="action" value="Fund"><input type="hidden" name="postNo" value="${pre.fundPost}"><div class="box">Fund post <strong>${ps.no} · ${esc(ps.title)}</strong></div><label class="f">Funder<select name="funder">${U.opts(St.FUNDERS, ps.funder)}</select></label>`; }
      return `<div class="fg"><label class="f">Action<select name="action" onchange="A.nrPostAction(this.value)">${U.opts(['Create', 'Close'])}</select></label>
      <label class="f post-close hidden">Post to close<select name="postNo">${S().posts.filter(p => p.status !== 'Filled' && p.status !== 'Closed').map(p => U.opt(p.no, p.no + ' · ' + p.title)).join('')}</select></label>
      <label class="f post-create">Post title<input name="title"></label><label class="f post-create">Department<select name="dept">${U.opts(St.DEPTS)}</select></label>
      <label class="f post-create">Person category<select name="cat">${U.opts(St.CATS)}</select></label><label class="f post-create">Level (proposed)<select name="level">${U.opts(['L1', 'L2', 'L3', 'L4', 'L5', 'L6', 'Stipend scale', 'Rate band (HR-09)', 'Award (HR-08)'], 'L3')}</select></label>
      <label class="f post-create">Cost centre<input name="cc" placeholder="CC-0000"></label><label class="f post-create">Funder<select name="funder">${U.opts(St.FUNDERS)}</select></label>
      <label class="f post-create">Direct manager (post title)<input name="dm" placeholder="e.g. HOD HR"></label><label class="f post-create" style="flex-direction:row;align-items:center;gap:8px;margin-top:22px"><input type="checkbox" name="funded" checked> Funded</label></div>`;
    },
    appoint: (pre) => {
      const vac = S().posts.filter(p => p.status === 'Vacant funded');
      return `${vac.length ? '' : '<div class="note">There is no vacant funded post. Create or fund a post first (establishment rule 1).</div>'}<div class="fg"><label class="f">First name<input name="first" value="${U.attr(pre.first || '')}"></label><label class="f">Last name<input name="last" value="${U.attr(pre.last || '')}"></label>
      <label class="f full">Post (vacant and funded only)<select name="postNo">${vac.map(p => U.opt(p.no, p.no + ' · ' + p.title + ' · ' + p.level, p.no === pre.postNo)).join('')}</select></label>
      <label class="f">Employment type<select name="cat">${U.opts(St.CATS)}</select></label><label class="f">Start date (first day worked)<input type="date" name="start"></label>
      <label class="f">Starting step<select name="step">${U.opts(['1', '2', '3', '4', '5'])}</select></label><label class="f">Monthly salary (R)<input type="number" name="salary"></label></div>
      <div class="note">Step 1 is the default. Step 2 needs relevant experience; step 3 needs HOD HR and Head of Finance; steps 4–5 need the CEO with a written reason. Put the reason in the motivation.</div>`;
    },
    agreement: () => `<div class="fg"><label class="f">Action<select name="action">${U.opts(['New', 'Renew', 'End'])}</select></label><label class="f">New end date<input type="date" name="endDate"></label></div>`,
    probation: () => `<div class="fg"><label class="f">Outcome<select name="outcome">${U.opts(['Confirm', 'Extend', 'Terminate'])}</select></label><label class="f">Extend until (if extending)<input type="date" name="until"></label></div>`,
    leave: () => `<div class="fg"><label class="f full">Leave type<select name="type">${U.opts(St.LEAVE_TYPES)}</select></label><label class="f">From<input type="date" name="from"></label><label class="f">To<input type="date" name="to"></label></div>`,
    leaveadj: () => `<div class="fg"><label class="f">Leave type<select name="type">${U.opts(['Annual', 'Sick', 'Family responsibility', 'Time off for overtime'])}</select></label><label class="f">Days (+ to add, − to deduct)<input type="number" step="0.25" name="days"></label></div>`,
    closure: () => `<div class="fg"><label class="f full">Closure<select name="y">${U.opts(['2026/27', '2027/28'], '2027/28')}</select></label><label class="f">From<input type="date" name="from" value="2027-12-20"></label><label class="f">To<input type="date" name="to" value="2028-01-07"></label></div><div class="note">Booked for every employee at once; public holidays inside the closure are skipped.</div>`,
    salary: (pre, p) => `<div class="fg"><label class="f">New step<select name="newStep">${U.opts(['1', '2', '3', '4', '5'], p ? String(Math.min(5, p.step + 1)) : '1')}</select></label><label class="f">New monthly salary (R)${p ? ` <span class="xs muted">now ${St.money(p.salary)}</span>` : ''}<input type="number" name="newSalary" value="${p ? Math.round(p.salary * 1.05 / 50) * 50 : ''}"></label></div>`,
    regrade: (pre, p) => `<div class="fg"><label class="f">New level<select name="newLevel">${U.opts(['L2', 'L3', 'L4', 'L5'])}</select></label><label class="f">New step<select name="newStep">${U.opts(['1', '2', '3', '4', '5'])}</select></label><label class="f full">New monthly salary (R) — lowest step at or above current pay${p ? ' (' + St.money(p.salary) + ')' : ''}<input type="number" name="newSalary"></label></div>`,
    amount: () => `<label class="f">Amount (R)<input type="number" name="amount"></label>`,
    bank: () => `<div class="fg"><label class="f">Bank<select name="bank">${U.opts(['ABSA', 'Capitec', 'FNB', 'Nedbank', 'Standard Bank', 'TymeBank', 'African Bank', 'Discovery Bank'])}</select></label><label class="f">Account number<input name="acct" inputmode="numeric"></label></div><div class="note">Attach the bank confirmation letter in Documents. The Head of Finance verifies before the next SimplePay run.</div>`,
    termination: () => `<div class="fg"><label class="f">Reason<select name="reason">${U.opts(['Resignation', 'Contract expiry', 'Operational requirements', 'Incapacity', 'Misconduct'])}</select></label><label class="f">Last working day<input type="date" name="lastDay"></label></div><div class="note">Final pay = salary to the last day + unused annual leave from PERSAL. Letter HR-05-LET-03. Approval starts an exit checklist.</div>`,
    reverse: (pre) => `<label class="f">Request to reverse<select name="reverses">${S().requests.filter(r => r.status === 'Approved' && !r.reversedBy && r.code !== '9.9').map(r => U.opt(r.no, r.no + ' · ' + short(r.code) + ' · ' + St.subjectLabel(r), r.no === pre.reverses)).join('')}</select></label>`,
    none: () => ''
  };
  const NEEDS_PERSON = c => !['1.1', '2.2', '3.7'].includes(c);
  const REQUIRED = { post: [], appoint: ['first', 'last', 'postNo', 'start', 'salary'], agreement: ['endDate'], leave: ['from', 'to'], leaveadj: ['days'], closure: ['from', 'to'], salary: ['newSalary'], regrade: ['newSalary'], amount: ['amount'], bank: ['acct'], termination: ['lastDay'], reverse: ['reverses'] };

  A.newRequest = function (codeArg, personId, pre) {
    pre = pre || {};
    const role = S().role;
    if (!['hradmin', 'hodhr', 'hof', 'ceo'].includes(role)) return U.toast('Only PERSAL users can create requests', 'bad');
    let cur = codeArg || (personId ? '4.2' : '2.2');
    const body = () => {
      const c = St.code(cur), p = personId ? St.person(personId) : null;
      return `<label class="f">Request type<select name="code" onchange="A.nrCode(this.value)">${St.CODES.map(x => U.opt(x.c, x.c + ' · ' + short(x.c), x.c === cur)).join('')}</select></label>
        <div class="small muted">Route: ${c.route.map(r => St.STEP_LABEL[r]).join(' → ')} · ${esc(c.p)}</div>
        ${NEEDS_PERSON(cur) ? `<label class="f">Person<select name="personId" onchange="A.nrPerson(this.value)"><option value="">Choose…</option>${U.peopleOpts(personId)}</select></label>` : ''}
        ${FIELDS[c.fields] ? FIELDS[c.fields](pre, p) : ''}
        ${cur !== '3.7' ? `<label class="f">Effective date<input type="date" name="effective" value="${pre.effective || ''}"></label>` : ''}
        <label class="f">Motivation<textarea name="motivation" placeholder="Reason, e.g. annual review outcome or added responsibility">${esc(pre.motivation || '')}</textarea></label>`;
    };
    const m = U.modal('New request', `<div id="nrBody" style="display:flex;flex-direction:column;gap:14px">${body()}</div>`, [{ label: 'Cancel' }, { label: 'Submit request', cls: 'pri', onClick: el => {
      const c = St.code(cur);
      const pid = NEEDS_PERSON(cur) ? U.val(el, 'personId') : null;
      if (NEEDS_PERSON(cur) && !pid) { U.toast('Choose the person', 'bad'); return false; }
      if (!U.need(el, (REQUIRED[c.fields] || []).filter(n => !(c.fields === 'post' && U.val(el, 'action') === 'Close')).concat(c.fields === 'post' && U.val(el, 'action') === 'Create' ? ['title', 'cc'] : []))) return false;
      const data = {}; el.querySelectorAll('#nrBody [name]').forEach(i => { if (!['code', 'personId', 'effective', 'motivation'].includes(i.name)) data[i.name] = i.type === 'checkbox' ? i.checked : i.value; });
      if (c.fields === 'appoint') { if (!data.postNo) { U.toast('No vacant funded post selected', 'bad'); return false; } }
      if (c.fields === 'leave' && St.workingDays(data.from, data.to) <= 0) { U.toast('The dates contain no working days', 'bad'); return false; }
      if (cur === '9.9' && !data.reverses) { U.toast('Nothing to reverse', 'bad'); return false; }
      const req = St.createRequest(cur, pid, { effective: U.val(el, 'effective'), motivation: U.val(el, 'motivation'), data, subjectName: c.fields === 'appoint' ? data.first + ' ' + data.last + ' (new)' : cur === '3.7' ? 'All employees' : c.fields === 'post' ? 'Post ' + (data.postNo || data.title) : undefined });
      U.toast('Request ' + req.no + ' created' + (req.status === 'Approved' ? ' and approved' : ' · now with ' + St.STEP_LABEL[St.currentStep(req).role]), 'ok');
      U.go('request/' + req.no); A.refresh();
    } }], { wide: true });
    A.nrCode = v => { cur = v; pre = {}; document.getElementById('nrBody').innerHTML = body(); };
    A.nrPerson = v => { personId = v; const keep = {}; m.el.querySelectorAll('#nrBody [name]').forEach(i => keep[i.name] = i.value); document.getElementById('nrBody').innerHTML = body(); ['effective', 'motivation'].forEach(k => { const e = m.el.querySelector(`[name="${k}"]`); if (e) e.value = keep[k] || ''; }); };
    A.nrPostAction = v => { m.el.querySelectorAll('.post-create').forEach(e => e.classList.toggle('hidden', v === 'Close')); m.el.querySelectorAll('.post-close').forEach(e => e.classList.toggle('hidden', v !== 'Close')); };
  };

  /* ================= Payroll instructions ================= */
  const PAYCODES = ['2.2', '3.8', '4.2', '4.3', '4.5', '4.9', '5.1', '2.4'];
  Pages.payroll = {
    title: 'Payroll instructions',
    render() {
      const list = S().requests.filter(r => PAYCODES.includes(r.code));
      const ready = list.filter(r => r.status === 'Approved' && !r.sentToPayroll);
      const isHof = S().role === 'hof';
      return `
      ${header('Payroll instructions', 'Approved requests that change pay are sent to SimplePay by the Head of Finance. SimplePay pays salaries only; PERSAL is the record.', `<button class="btn" onclick="A.payCsv()">Export SimplePay batch (CSV)</button>`)}
      ${tiles([{ l: 'Ready to send', v: ready.length, s: 'Approved, not yet in SimplePay', c: 'var(--a)' }, { l: 'In approval', v: list.filter(r => r.status === 'Pending').length, s: 'Still on their route' }, { l: 'Sent this month', v: list.filter(r => r.sentToPayroll && r.sentToPayroll.slice(0, 7) === St.todayIso().slice(0, 7)).length, s: 'Marked as captured in SimplePay', c: 'var(--g)' }, { l: 'Next pay date', v: '25 ' + St.fmtDate(St.todayIso()).slice(3, 6), s: 'Cut-off on the 20th' }])}
      <section class="card" style="min-width:0;padding:6px 8px">
        ${table(['Reference', 'Instruction', 'Person', 'Effective', 'Amount / change', 'Status', ''], list.map(r => {
          const d = r.data || {};
          const amt = d.newSalary ? St.money(d.newSalary) + ' / month' : d.amount ? St.money(d.amount) + ' once-off' : d.days ? d.days + ' unpaid day(s)' : d.acct ? 'New bank account' : d.salary ? St.money(d.salary) + ' / month' : r.code === '5.1' ? 'Final pay + leave payout' : '—';
          return `<tr><td class="m small"><a href="#/request/${r.no}">${r.no}</a></td><td style="font-weight:700">${esc(short(r.code))}</td><td>${esc(St.subjectLabel(r))}</td><td class="nw muted">${St.fmtShort(r.effective)}</td><td>${amt}</td><td>${r.sentToPayroll ? pill('Sent · ' + St.fmtShort(r.sentToPayroll), 'g') : r.status === 'Approved' ? pill('Ready to send', 'a') : r.status === 'Pending' ? pill('With ' + stageOf(r), 'b') : spill(r.status)}</td><td class="nw">${r.status === 'Approved' && !r.sentToPayroll ? (isHof ? `<button class="btn sm pri" onclick="A.paySent('${r.no}')">Mark sent to SimplePay</button>` : '<span class="small muted">Head of Finance sends</span>') : ''}</td></tr>`;
        }), { empty: 'No payroll instructions yet.' })}
      </section>
      <div class="note">Unpaid leave approved in the leave portal creates instruction 3.8 automatically. Banking changes are verified by the Head of Finance before the next pay run.</div>`;
    }
  };
  Object.assign(A, {
    paySent(no) { const r = S().requests.find(x => x.no === no); r.sentToPayroll = St.todayIso(); St.log('Exported', St.subjectLabel(r), 'Payroll instruction sent to SimplePay', no); St.save(); U.toast(no + ' marked as sent', 'ok'); A.refresh(); },
    payCsv() {
      const rows = [['Reference', 'Code', 'Instruction', 'PERSAL no', 'Name', 'Effective', 'New salary', 'Once-off amount', 'Unpaid days', 'Bank', 'Account']].concat(S().requests.filter(r => PAYCODES.includes(r.code) && r.status === 'Approved' && !r.sentToPayroll).map(r => { const p = r.personId ? St.person(r.personId) : null, d = r.data || {}; return [r.no, r.code, short(r.code), p ? p.persal : '', St.subjectLabel(r), r.effective, d.newSalary || d.salary || '', d.amount || '', d.days || '', d.bank || '', d.acct || '']; }));
      U.download('simplepay-batch-' + St.todayIso() + '.csv', U.csv(rows)); St.log('Exported', '—', 'SimplePay payroll batch (CSV)');
    }
  });
})();

</script>
<script>/* js/pages/leave.js */
/* Leave (HR) · Leave portal (staff & managers) · Leave history import */
(function () {
  const St = window.Store, U = window.UI, { esc, pill, spill, header, tiles, table, Pages } = U;
  const S = () => St.S;
  const within = (d, n) => window.Org.within(d, n);

  const ENT = [
    ['Annual', '15 working days per year (1 day per 17 worked); 20 after 5 completed years', 'Yes', 'Cycle from the employment date. Taken in the Dec–Jan closure; other times only by exception. Carried-over leave must be used within 4 months of the new cycle (longer only with management approval); staff warned at 60 and 30 days. Paid out on exit: current cycle plus carried-over leave up to 5 days'],
    ['Sick', '30 days in a 36-month cycle (5-day week)', 'Yes', 'Medical certificate if more than 2 consecutive days, or sick more than twice in 8 weeks; due within 2 working days of return'],
    ['Family responsibility', '3 days per annual cycle', 'Yes', 'Birth or illness of a child; death of an immediate family member'],
    ['Time off for overtime', 'As agreed in writing', 'Yes', 'Recorded as its own type, never as annual leave [confirm rule with HOD HR]'],
    ['Unpaid', 'By approval', 'No', 'Direct manager and HOD HR approve; Finance is notified through a payroll instruction'],
    ['Maternity', '4 consecutive months', 'No (UIF)', 'Unless contract or benefit scheme provides'],
    ['Parental', '10 consecutive days', 'No', 'Unless contractually agreed'],
    ['Adoption / commissioning parental', '10 weeks (one parent)', 'No', 'Other parent takes parental leave'],
    ['Special (incl. study)', 'Management discretion', 'Discretion', 'Direct manager recommends; HOD HR approves; CEO if more than 5 days']
  ];

  /* ================= Leave (HR view) ================= */
  let LF = { st: '', q: '' };
  Pages.leave = {
    title: 'Leave',
    render() {
      const s = S(), today = St.todayIso();
      const lv = s.leave;
      const onToday = lv.filter(l => l.status === 'Approved' && l.from <= today && l.to >= today);
      const certDue = lv.filter(l => l.type === 'Sick' && l.status === 'Approved' && l.days > 2 && !l.certificate && !l.certReceived);
      const unpaid = lv.filter(l => l.type === 'Unpaid' && l.status === 'Approved');
      const unpaidToSend = unpaid.filter(l => { const r = s.requests.find(x => x.no === l.payroll); return !r || r.status !== 'Approved'; });
      const expiring = s.people.filter(p => p.status === 'Active' && p.leave.expiring > 0 && within(p.leave.expiryDate, 60));
      const flags = []
        .concat(certDue.map(l => ({ who: St.nameOf(l.personId), t: l.days + ' sick days, no certificate on file', a: 'Request certificate', c: 'r', act: `A.certIn('${l.no}')`, actL: 'Mark received' })))
        .concat([{ who: 'Bongani Khumalo', t: 'Absent on Jibble 17 Nov, no leave recorded', a: 'Check with manager', c: 'r' }])
        .concat(expiring.map(p => ({ who: St.fullName(p), t: p.leave.expiring + ' annual days expire on ' + St.fmtDate(p.leave.expiryDate), a: p.leave.warned ? 'Warning sent' : 'Send warning', c: 'a', act: p.leave.warned ? '' : `A.warnExpiry('${p.id}')`, actL: 'Send warning' })))
        .concat(s.people.filter(p => p.status === 'Active' && St.isEmployee(p) && !p.dm && p.id !== 'p1').map(p => ({ who: St.fullName(p), t: 'No direct manager on record', a: 'Fix in person record', c: 'a', href: '#/person/' + p.id })));
      let list = lv.slice();
      if (LF.st) list = list.filter(l => l.status === LF.st);
      if (LF.q) list = list.filter(l => St.nameOf(l.personId).toLowerCase().includes(LF.q.toLowerCase()));
      return `
      ${header('Leave', 'HR-06 Leave Policy · PERSAL is the leave record from cut-over on <strong style="color:var(--ink)">1 April 2027</strong> · SimplePay pays salaries only', `<button class="btn" onclick="A.newRequest('3.4')">Capture paper form (HR-06-FRM-01)</button><a class="btn" href="#/leaveimport">Opening balances</a><a class="btn pri" href="#/portal">Open leave portal ↗</a>`)}
      <div class="info row" style="gap:12px">${pill('Leave portal', 'x')}<span>Staff apply in the separate leave portal and their <strong>direct manager</strong> approves it there. Neither can see personnel records. HR monitors here, keeps medical certificates confidential, and sends unpaid leave to SimplePay as a payroll instruction.</span></div>
      ${tiles([{ l: 'With direct managers', v: lv.filter(l => l.status === 'With manager').length, s: 'Waiting for approval', c: 'var(--b)' }, { l: 'On leave today', v: onToday.length, s: onToday.map(l => St.nameOf(l.personId)).join(', ') || 'Approved leave' }, { l: 'Expiring in 60 days', v: expiring.length, s: 'Warned at 60 and 30 days', c: 'var(--a)' }, { l: 'Medical certificates due', v: certDue.length, s: 'Per HR-06 §6.2', c: 'var(--r)' }, { l: 'Unpaid leave to send', v: unpaidToSend.length, s: 'Payroll instruction to SimplePay' }])}
      <section class="card" style="min-width:0">
        <div class="between" style="padding:16px 20px 4px"><h2 class="h2" style="margin:0">All leave requests</h2><div class="row"><input class="in" style="width:200px" placeholder="Search name" value="${U.attr(LF.q)}" onchange="A.lvF('q',this.value)"><select class="in" style="width:auto" onchange="A.lvF('st',this.value)"><option value="">All statuses</option>${U.opts(['With manager', 'Approved', 'Declined', 'Cancelled'], LF.st)}</select></div></div>
        <div style="padding:0 8px 8px">${table(['Ref', 'Employee', 'Type', 'Dates', 'Days', 'Applied', 'Approver', 'Status'], list.map(l => `<tr><td class="m small muted">${l.no}</td><td style="font-weight:700"><a href="#/person/${l.personId}" style="text-decoration:none">${esc(St.nameOf(l.personId))}</a></td><td>${esc(l.type)}</td><td class="nw">${St.fmtShort(l.from)}${l.to !== l.from ? ' – ' + St.fmtShort(l.to) : ''}</td><td>${l.days}</td><td class="muted nw">${St.fmtShort(l.submitted)}</td><td>${esc(l.decidedBy || approverName(l))}</td><td>${spill(l.status)}${l.reason ? `<div class="xs muted">${esc(l.reason)}</div>` : ''}</td></tr>`), { empty: 'No leave requests.' })}</div>
      </section>
      <div class="grid g-2">
        <section class="card pad" style="min-width:0"><h2 class="h2">Entitlements · HR-06 Leave Policy</h2>
          ${table(['Leave type', 'Entitlement', 'Paid', 'Rule built into PERSAL'], ENT.map(e => `<tr><td style="font-weight:700" class="nw">${e[0]}</td><td style="min-width:160px">${e[1]}</td><td>${e[2]}</td><td class="small muted" style="min-width:220px">${e[3]}</td></tr>`))}
          <p class="small muted" style="margin:12px 0 0">Applies to permanent, fixed-term and part-time employees. Public holidays are never counted as leave. Where legislation and policy conflict, legislation prevails.</p>
        </section>
        <div style="display:flex;flex-direction:column;gap:16px">
          <section class="card pad"><h2 class="h2">Who approves</h2>
            ${[['Staff', 'Direct manager (an employee)'], ['Heads of Department', 'CEO'], ['CEO', 'Board Chair or Board Treasurer'], ['Interns placed with clients', 'HOD HR (Angels) [proposed]'], ['Programme staff (Social Performance Practitioners)', 'National Operations Co-ordinator'], ['Special leave', 'HOD HR; CEO over 5 days']].map(r => `<div class="list-row"><span style="font-weight:700">${r[0]}</span><span class="muted" style="text-align:right">${r[1]}</span></div>`).join('')}
            <p class="small muted" style="margin:10px 0 0">Contractors and functional managers never approve leave. If the direct manager has not acted after 3 working days, the request moves to the next level.</p></section>
          <section class="card pad"><h2 class="h2">HR follow-up</h2><div style="display:flex;flex-direction:column;gap:8px">
            ${flags.map(f => `<div class="flag" style="background:var(--${f.c}-bg)"><span class="dot" style="background:var(--${f.c})"></span><span style="flex:1"><strong>${esc(f.who)}</strong> · ${esc(f.t)}</span>${f.act ? `<button class="btn sm" onclick="${f.act}">${f.actL}</button>` : f.href ? `<a class="small" style="font-weight:700" href="${f.href}">${f.a}</a>` : `<span class="small" style="font-weight:700;color:var(--${f.c})">${f.a}</span>`}</div>`).join('') || '<div class="empty">Nothing to follow up</div>'}
          </div></section>
        </div>
      </div>
      <div class="grid g-2">
        <section class="card pad" style="min-width:0">
          <div class="between" style="margin-bottom:10px"><h2 class="h2" style="margin:0">December office closure</h2>${['hodhr'].includes(S().role) ? `<button class="btn sm" onclick="A.newRequest('3.7')">Set closure dates</button>` : ''}</div>
          ${table(['Closure', 'Dates', 'Leave days', 'Status'], s.closures.map(c => `<tr><td style="font-weight:700">${c.y}</td><td class="nw">${c.from ? St.fmtDate(c.from) + ' – ' + St.fmtDate(c.to) : '—'}</td><td>${c.from ? St.workingDays(c.from, c.to) : '—'}</td><td>${spill(c.st)}</td></tr>`))}
          <p class="small muted" style="margin:10px 0 0">Approved by the CEO and booked for every employee at once; public holidays inside the closure are skipped. If someone has too few days they fall into a leave deficit, recouped on termination (Leave Policy). <strong style="color:var(--a)">[For review: a deduction needs written agreement, BCEA s34]</strong>.</p>
        </section>
        <section class="card pad" style="min-width:0"><h2 class="h2">Unpaid leave · to SimplePay</h2>
          ${table(['Employee', 'Dates', 'Days', 'Payroll instruction'], unpaid.map(l => { const r = s.requests.find(x => x.no === l.payroll); return `<tr><td style="font-weight:700">${esc(St.nameOf(l.personId))}</td><td class="nw">${St.fmtShort(l.from)} – ${St.fmtShort(l.to)}</td><td>${l.days}</td><td>${r ? `<a href="#/request/${r.no}">${r.status === 'Approved' ? pill('Sent · ' + r.no, 'g') : pill('Waiting for ' + St.STEP_LABEL[(St.currentStep(r) || {}).role], 'a')}</a>` : '—'}</td></tr>`; }), { empty: 'No unpaid leave.' })}
          <p class="small muted" style="margin:10px 0 0">Jibble attendance is compared with approved leave each month; days absent without leave are flagged here for HR.</p>
        </section>
      </div>
      <section class="card warn pad row" style="gap:12px"><strong>Still to decide:</strong><span style="font-size:13px">leave rules for interns, volunteers and mentors on SLAs (HR-06 covers employees only); whether the 4-month forfeiture of carried-over leave fits BCEA s20(4) (6 months); and approving Leave Policy Rev 3, which moves leave from SimplePay to PERSAL.</span></section>`;
    }
  };
  function approverName(l) { const p = St.person(l.personId); return p && p.dm ? St.nameOf(p.dm) : 'Board'; }
  Object.assign(A, {
    lvF(k, v) { LF[k] = v; A.refresh(); },
    certIn(no) { const l = S().leave.find(x => x.no === no); l.certReceived = true; St.log('Changed', St.nameOf(l.personId), 'Medical certificate received (kept confidential)', no); St.save(); A.refresh(); },
    warnExpiry(id) { const p = St.person(id); p.leave.warned = true; St.log('Changed', St.fullName(p), 'Leave expiry warning sent (' + p.leave.expiring + ' days, ' + St.fmtDate(p.leave.expiryDate) + ')'); St.save(); U.toast('Warning sent to ' + St.fullName(p), 'ok'); A.refresh(); }
  });

  /* ================= Leave portal (separate app) ================= */
  let LP = { k: 0, from: '', to: '', type: 'Annual' };
  function approverIds(l) {
    const p = St.person(l.personId), ids = [p.dm || 'board'];
    // Escalation: after 3 working days with no action, the next level can also act
    if (l.status === 'With manager' && St.workingDays(l.submitted, St.todayIso()) > 4 && p.dm) { const m = St.person(p.dm); ids.push(m && m.dm ? m.dm : 'board'); }
    return ids;
  }
  function myTeamQueue() {
    const me = St.me(), my = S().role === 'board' ? 'board' : me.personId;
    return S().leave.filter(l => l.status === 'With manager' && approverIds(l).includes(my) && l.personId !== my);
  }
  Pages.portal = {
    title: 'Leave portal', standalone: true,
    render() {
      const me = St.me(), p = me.personId ? St.person(me.personId) : null;
      const queue = myTeamQueue();
      if (LP.role !== S().role) { LP.role = S().role; LP.k = p ? 0 : 1; LP.from = LP.to = ''; }
      if (!p) LP.k = 1;
      const tabs = (p ? ['My leave'] : []).concat(['Team approvals · ' + queue.length]);
      const mine = p ? S().leave.filter(l => l.personId === p.id) : [];
      const days = St.workingDays(LP.from, LP.to), skipped = days ? (St.workingDays.lastSkipped || []) : [];
      const closure = S().closures.find(c => c.st === 'Approved');
      return `
      <header class="phead"><div class="in"><div class="logo">A</div><div style="flex:1 1 200px"><div style="font-weight:800;font-size:16px">Angels Leave</div><div class="small muted">Staff leave portal · separate from PERSAL</div></div><div class="small muted" style="text-align:right">Signed in as <strong style="color:var(--ink)">${esc(me.name)}</strong><br>Microsoft 365</div></div></header>
      <main class="pmain">
        <div class="seg" role="tablist">${tabs.map((t, i) => { const k = p ? i : 1; return `<button class="${LP.k === k ? 'on' : ''}" onclick="A.lpTab(${k})">${t}</button>`; }).join('')}</div>
        ${LP.k === 0 && p ? `
          ${p.leave.expiring > 0 ? `<div class="flag" style="background:var(--a-bg);color:var(--a)"><strong>${p.leave.expiring} annual days expire on ${St.fmtDate(p.leave.expiryDate)}.</strong><span>Book them before then, or speak to your manager.</span></div>` : ''}
          ${tiles([{ l: 'Annual leave', v: p.leave.annual.toFixed(2), s: '15 days a year · 20 after 5 years', c: p.leave.annual < 0 ? 'var(--r)' : '' }, { l: 'Sick leave', v: p.leave.sick, s: '30 days per 36-month cycle' }, { l: 'Family responsibility', v: p.leave.family, s: '3 days a year' }, { l: 'Time off for overtime', v: p.leave.overtime.toFixed(1), s: 'Hours agreed in writing' }])}
          <div class="grid g-2">
            <section class="card pad" style="display:flex;flex-direction:column;gap:12px">
              <h2 class="h2" style="margin:0">Apply for leave</h2>
              <label class="f">Leave type<select id="lpType" onchange="A.lpSet('type',this.value)">${U.opts(['Annual', 'Sick', 'Family responsibility', 'Time off for overtime', 'Special', 'Unpaid'], LP.type)}</select></label>
              <div class="fg"><label class="f">From<input type="date" id="lpFrom" value="${LP.from}" onchange="A.lpSet('from',this.value)"></label><label class="f">To<input type="date" id="lpTo" value="${LP.to}" min="${LP.from}" onchange="A.lpSet('to',this.value)"></label></div>
              <div class="box" style="font-size:13px"><strong>${days} working day${days === 1 ? '' : 's'}</strong> · weekends and public holidays are not counted${skipped.length ? `<div class="small muted" style="margin-top:4px">Skipped: ${skipped.map(d => St.fmtShort(d) + ' ' + St.holidayName(d)).join(', ')}</div>` : ''}</div>
              <label class="f">Note for your manager (optional)<textarea id="lpNote" placeholder="Add a note…"></textarea></label>
              ${LP.type === 'Sick' ? `<label class="f">Medical certificate (sick leave over 2 days)<input type="file" id="lpCert" accept=".pdf,.jpg,.jpeg,.png"></label>` : ''}
              <button class="btn pri" onclick="A.lpApply()">Send to ${esc(p.dm ? St.nameOf(p.dm) : 'the Board')}</button>
            </section>
            <section class="card pad" style="min-width:0"><h2 class="h2">My requests</h2>
              ${table(['Type', 'Dates', 'Days', 'Status', ''], mine.map(l => `<tr><td style="font-weight:700">${esc(l.type)}</td><td class="nw">${St.fmtShort(l.from)}${l.to !== l.from ? ' – ' + St.fmtShort(l.to) : ''}</td><td>${l.days}</td><td>${l.status === 'Declined' ? pill('Declined · reason given', 'r') + `<div class="xs muted" style="margin-top:3px">${esc(l.reason)}</div>` : spill(l.status)}</td><td>${l.status === 'With manager' ? `<button class="link" onclick="A.lpCancel('${l.no}')">Cancel</button>` : ''}</td></tr>`), { empty: 'You have not applied for leave yet.' })}
              ${closure ? `<div class="info small" style="margin-top:14px">December closure: <strong>${St.fmtDate(closure.from)} – ${St.fmtDate(closure.to)}</strong>, ${St.workingDays(closure.from, closure.to)} leave days booked automatically.</div>` : ''}
            </section>
          </div>` : `
          <section class="card" style="min-width:0">
            <div class="between" style="padding:16px 20px 4px"><h2 class="h2" style="margin:0">Waiting for you · your direct reports</h2><span class="small muted">Moves to the next level after 3 working days</span></div>
            <div style="padding:0 8px 8px">${table(['Name', 'Type', 'Dates', 'Days', 'Balance after', 'Team on leave', ''], queue.map(l => {
              const ap = St.person(l.personId), k = St.leaveKey(l.type), after = k ? St.round2(ap.leave[k] - l.days) : '—';
              const overlap = S().leave.filter(o => o !== l && o.status === 'Approved' && St.person(o.personId).dm === ap.dm && o.from <= l.to && o.to >= l.from).length;
              const esc8 = approverIds(l)[0] !== (S().role === 'board' ? 'board' : St.me().personId);
              return `<tr><td style="font-weight:700">${esc(St.fullName(ap))}${esc8 ? `<div class="xs" style="color:var(--a)">Escalated to you</div>` : ''}</td><td>${esc(l.type)}${l.note ? `<div class="xs muted">${esc(l.note)}</div>` : ''}</td><td class="nw">${St.fmtShort(l.from)}${l.to !== l.from ? ' – ' + St.fmtShort(l.to) : ''}</td><td>${l.days}</td><td style="${after < 0 ? 'color:var(--r);font-weight:700' : ''}">${after}</td><td class="muted">${overlap ? overlap + ' others off' : 'None'}</td><td class="nw"><button class="btn sm ok" onclick="A.lpDecide('${l.no}',true)">Approve</button> <button class="btn sm bad" onclick="A.lpDecide('${l.no}',false)">Decline</button></td></tr>`;
            }), { empty: 'No leave is waiting for you.' })}</div>
            <p class="small muted" style="margin:0;padding:0 20px 16px">A reason is required to decline, and the employee sees it. You only see leave for people who report directly to you.</p>
          </section>`}
        <p class="small" style="color:var(--muted2);margin:0">Personnel records, pay and documents are not visible here. Payslips stay in SimplePay. Questions: HR on Teams.</p>
      </main>`;
    }
  };
  Object.assign(A, {
    lpTab(k) { LP.k = k; A.refresh(); },
    lpSet(k, v) { LP[k] = v; if (k === 'from' && (!LP.to || LP.to < v)) LP.to = v; A.refresh(); },
    lpApply() {
      const me = St.me(), p = St.person(me.personId), days = St.workingDays(LP.from, LP.to);
      if (!LP.from || !LP.to) return U.toast('Choose the from and to dates', 'bad');
      if (days <= 0) return U.toast('Those dates have no working days', 'bad');
      const k = St.leaveKey(LP.type);
      if (k && ['annual', 'family'].includes(k) && days > p.leave[k]) return U.toast('You only have ' + p.leave[k] + ' ' + LP.type.toLowerCase() + ' days. Speak to HR about unpaid or special leave.', 'bad');
      const overlap = S().leave.some(l => l.personId === p.id && ['With manager', 'Approved'].includes(l.status) && l.from <= LP.to && l.to >= LP.from);
      if (overlap) return U.toast('You already have leave on some of these days', 'bad');
      const cert = document.getElementById('lpCert'); const hasCert = cert && cert.files.length > 0;
      if (LP.type === 'Sick' && days > 2 && !hasCert) U.toast('Remember: a medical certificate is due within 2 working days of return', '');
      const l = St.applyLeave(p.id, LP.type, LP.from, LP.to, document.getElementById('lpNote').value, hasCert);
      St.save(); LP.from = LP.to = ''; U.toast('Sent to ' + (p.dm ? St.nameOf(p.dm) : 'the Board') + ' · ' + l.no, 'ok'); A.refresh();
    },
    lpCancel(no) { const l = S().leave.find(x => x.no === no); l.status = 'Cancelled'; St.log('Changed', St.nameOf(l.personId), 'Leave request cancelled by employee', no); St.save(); A.refresh(); },
    lpDecide(no, ok) {
      const l = S().leave.find(x => x.no === no);
      if (ok) { St.decideLeave(l, true); U.toast('Approved' + (l.type === 'Unpaid' ? ' · payroll instruction ' + l.payroll + ' raised' : ''), 'ok'); A.refresh(); return; }
      U.modal('Decline leave · ' + St.nameOf(l.personId), `<label class="f">Reason (the employee sees this)<textarea name="why"></textarea></label>`, [{ label: 'Cancel' }, { label: 'Decline', cls: 'bad', onClick: m => { if (!U.need(m, ['why'])) return false; St.decideLeave(l, false, U.val(m, 'why')); U.toast('Declined'); A.refresh(); } }]);
    }
  });

  /* ================= Leave history import ================= */
  let LI = { sel: 1 };
  const LI_STEPS = [['List sources', 'SimplePay, Excel trackers, paper forms, closure dates'], ['Scan paper', 'One scan per form, named by PERSAL no and date'], ['Fill template', 'One row per leave event, every source'], ['Check each person', 'Earned − taken vs SimplePay'], ['Settle differences', 'Credit back, accept or refer'], ['Sign off', 'Employee and HR sign the opening balance'], ['Cut over', 'Leave stops in SimplePay; balances go live']];
  Pages.leaveimport = {
    title: 'Leave history import',
    render() {
      const s = S(), step = s.liStep == null ? 1 : s.liStep;
      const rows = s.leaveImport, sel = rows[LI.sel] || rows[0];
      const f2 = n => n == null ? '—' : Number(n).toFixed(2);
      return `
      ${header('Leave history import', 'Each person starts on PERSAL with an opening balance checked by HR and signed by the employee. Old records come across read-only, with the scans attached.', `<button class="btn" onclick="A.liTemplate()">Download import template</button><button class="btn pri" onclick="document.getElementById('liFile').click()">Upload source file</button><input type="file" id="liFile" class="hidden" accept=".csv" onchange="A.liUpload(this)">`)}
      <section class="card pad">
        <div class="between" style="margin-bottom:12px"><h2 class="h2" style="margin:0">Cut-over steps</h2><span class="row small muted">Leave stops in SimplePay on <strong style="color:var(--ink)">1 April 2027</strong>${S().role === 'hodhr' || S().role === 'hradmin' ? `<button class="btn sm" onclick="A.liStep(-1)" ${step <= 0 ? 'disabled' : ''}>◀</button><button class="btn sm pri" onclick="A.liStep(1)" ${step >= 7 ? 'disabled' : ''}>Mark step done</button>` : ''}</span></div>
        <ol class="flow">${LI_STEPS.map(([t, d], i) => `<li class="${i < step ? 'done' : i === step ? 'now' : 'next'}"><span class="row" style="gap:8px"><span class="n">${i + 1}</span><span class="st">${i < step ? 'Done' : i === step ? 'Now' : 'Next'}</span></span><span class="t">${t}</span><span class="d">${d}</span></li>`).join('')}</ol>
      </section>
      <section class="card" style="min-width:0">
        <div class="between" style="padding:16px 20px 4px"><h2 class="h2" style="margin:0">Per-person check · annual leave</h2><span class="small muted">Earned − taken (all sources) compared with the last SimplePay balance. Click a row to see sources.</span></div>
        <div style="padding:0 8px 8px">${table(['PERSAL no', 'Name', 'Earned', 'Taken', 'Expected', 'SimplePay', 'Difference', 'Wrongly deducted', 'Status', 'Sign-off'], rows.map((r, i) => {
          const p = St.person(r.personId), exp = r.earned != null ? r.earned - r.taken : null, diff = exp != null ? St.round2(r.sp - exp) : null;
          return `<tr class="click ${i === LI.sel ? 'sel' : ''}" onclick="A.liSel(${i})"><td class="m small muted">${p.persal}</td><td style="font-weight:700">${esc(St.fullName(p))}</td><td>${f2(r.earned)}</td><td>${f2(r.taken)}</td><td>${f2(exp)}</td><td>${f2(r.sp)}</td><td style="font-weight:800;color:${diff === 0 ? 'var(--g)' : diff == null ? 'var(--muted)' : 'var(--r)'}">${diff == null ? '—' : diff.toFixed(2)}</td><td>${r.wrong == null ? '—' : r.wrong}</td><td>${spill(r.st)}</td><td class="nw" onclick="event.stopPropagation()">${r.st === 'Signed' ? pill('Employee ✓ HR ✓', 'g') : r.earned == null ? `<button class="btn sm" onclick="A.liCheck(${i})">Run check</button>` : `<button class="btn sm" ${r.empSigned ? 'disabled' : ''} onclick="A.liSign(${i},'emp')">${r.empSigned ? 'Employee ✓' : 'Employee signs'}</button> <button class="btn sm" ${r.hrSigned ? 'disabled' : ''} onclick="A.liSign(${i},'hr')">${r.hrSigned ? 'HR ✓' : 'HR signs'}</button>`}</td></tr>`;
        }))}</div>
      </section>
      <div class="grid g-2">
        <section class="card pad" style="min-width:0"><h2 class="h2">Sources · ${esc(St.nameOf(sel.personId))}</h2>
          ${table(['Source', 'Years', 'Records', 'Evidence'], [['SimplePay (admin report)', '2018–2027', 14, 'Leave transactions, adjustments and expired leave'], ['HR Excel tracker', '2021', 6, 'Tracker file, the person’s row only'], ['Paper leave forms', '2019–2021', 9, 'Scans: PERSALno_LEAVE_YYYY-MM-DD'], ['December closure list', 'Every year', 6, 'Closure dates approved by the CEO']].map(r => `<tr><td style="font-weight:700">${r[0]}</td><td class="nw">${r[1]}</td><td>${r[2]}</td><td class="muted">${r[3]}</td></tr>`))}
          <p class="small muted" style="margin:10px 0 0">Import template: one row per leave event · PERSAL no · type · from · to · days · source · document reference · status (approved, cancelled, disputed).</p>
        </section>
        <section class="card pad" style="min-width:0"><h2 class="h2">Differences to settle · ${esc(St.nameOf(sel.personId))}</h2>
          <div style="display:flex;flex-direction:column;gap:8px">${[['Public holidays recorded as leave', (sel.wrong || 0) ? Math.min(1, sel.wrong) + ' days' : '0 days', 'Found automatically by the public holiday calendar', 'Credit back', 'g'], ['Overtime time off recorded as annual leave', Math.max(0, (sel.wrong || 0) - 1) + ' days', 'Signed overtime form shows the hours bank', 'Credit back', 'g'], ['Closure days with no leave record', '0 days', 'Closure dates known, nothing captured', 'HR to confirm', 'a'], ['Leave not explained by any record', sel.earned != null ? Math.abs(St.round2(sel.sp - (sel.earned - sel.taken))).toFixed(2) + ' days' : '—', 'Likely expired leave or an HR adjustment', 'Decision needed', 'r']].map(d => `<div style="padding:10px 12px;border-radius:10px;background:var(--${d[4]}-bg);display:flex;flex-direction:column;gap:4px"><div class="between"><strong style="font-size:13px">${d[0]}</strong><span style="font-size:13px;font-weight:800;color:var(--${d[4]})">${d[1]}</span></div><span class="small muted">${d[2]}</span><span class="small" style="font-weight:700;color:var(--${d[4]})">${d[3]}</span></div>`).join('')}</div>
          <div class="row" style="margin-top:12px"><button class="btn sm" onclick="A.liDispute(${LI.sel})">Load disputed days as "disputed"</button><button class="btn sm" onclick="A.newRequest('3.6','${sel.personId}')">Adjust balance (3.6)</button></div>
          <p class="small muted" style="margin:10px 0 0">Disputed days are loaded as "disputed" so the rest of the balance can go live. Adjustments go through request 3.6 (HR → HOD HR → HOF).</p>
        </section>
      </div>`;
    }
  };
  Object.assign(A, {
    liSel(i) { LI.sel = i; A.refresh(); },
    liStep(d) { const s = S(); s.liStep = Math.max(0, Math.min(7, (s.liStep == null ? 1 : s.liStep) + d)); St.log('Changed', '—', 'Leave cut-over step ' + s.liStep + ' of 7'); St.save(); A.refresh(); },
    liCheck(i) { const r = S().leaveImport[i], p = St.person(r.personId); const yrs = Math.max(1, (Date.now() - new Date(p.start)) / 3.156e10); r.earned = St.round2(yrs * 15); r.taken = St.round2(r.earned - r.sp - 1); r.wrong = 1; r.st = 'Differences'; r.empSigned = r.hrSigned = false; St.log('Changed', St.fullName(p), 'Leave history check run'); St.save(); A.refresh(); },
    liSign(i, who) {
      const r = S().leaveImport[i], p = St.person(r.personId);
      if (who === 'emp') r.empSigned = true; else r.hrSigned = true;
      if (r.empSigned && r.hrSigned) { r.st = 'Signed'; p.leave.annual = St.round2(r.earned - r.taken); }
      else r.st = 'Agreed';
      St.log('Approved', St.fullName(p), 'Opening leave balance signed by ' + (who === 'emp' ? 'employee' : 'HR')); St.save(); A.refresh();
    },
    liDispute(i) { const r = S().leaveImport[i]; r.st = 'Disputed'; St.log('Changed', St.nameOf(r.personId), 'Disputed leave days loaded as disputed'); St.save(); A.refresh(); },
    liTemplate() { U.download('persal-leave-history-template.csv', U.csv([['persal_no', 'type', 'from', 'to', 'days', 'source', 'document_reference', 'status'], [S().people[4].persal, 'Annual', '2025-12-22', '2026-01-09', '11', 'SimplePay', 'SP-2025-1188', 'approved']])); },
    liUpload(inp) {
      const f = inp.files[0]; if (!f) return;
      f.text().then(t => {
        const rows = U.parseCsv(t); if (rows.length < 2) return U.toast('No rows found', 'bad');
        const head = rows[0].map(h => h.trim().toLowerCase()), pi = head.indexOf('persal_no');
        if (pi < 0) return U.toast('The file needs a persal_no column (use the template)', 'bad');
        const per = {}; rows.slice(1).forEach(r => { const p = St.personByPersal((r[pi] || '').trim()); if (p) per[p.id] = (per[p.id] || 0) + 1; });
        Object.keys(per).forEach(id => { if (!S().leaveImport.some(x => x.personId === id)) S().leaveImport.push({ personId: id, earned: null, taken: null, sp: St.person(id).leave.annual, wrong: null, st: 'Checking' }); });
        St.log('Changed', '—', 'Leave source file imported: ' + f.name + ' (' + (rows.length - 1) + ' events)'); St.save();
        U.toast((rows.length - 1) + ' leave events read for ' + Object.keys(per).length + ' people', 'ok'); A.refresh();
      });
    }
  });
})();

</script>
<script>/* js/pages/hr.js */
/* Performance · Discipline & grievance */
(function () {
  const St = window.Store, U = window.UI, { esc, pill, spill, header, tiles, table, Pages } = U;
  const S = () => St.S;

  /* ================= Performance ================= */
  const LIBS = {
    'Programme / Field': [['Programme Delivery', 'Delivers activities according to plans'], ['Beneficiary Engagement', 'Engages beneficiaries respectfully'], ['Reporting', 'Submits accurate reports on time'], ['Health & Safety Compliance', 'Follows safety and safeguarding'], ['Problem Resolution', 'Manages field challenges effectively']],
    'Admin / Operations': [['Administrative Accuracy', 'Records and filing are complete and correct'], ['Turnaround Time', 'Requests handled within agreed times'], ['Stakeholder Service', 'Responds helpfully to staff and partners'], ['Asset & Resource Care', 'Looks after equipment and stock'], ['Process Compliance', 'Follows procedures and controls']],
    'Finance': [['Financial Accuracy', 'Transactions captured correctly'], ['Month-end Deadlines', 'Reconciliations and reports on time'], ['Controls & Compliance', 'Applies financial controls and policy'], ['Budget Support', 'Supports budget holders with clear information'], ['Audit Readiness', 'Keeps evidence ready for audit']],
    'HR / Compliance / QMS': [['Record Integrity', 'Personnel records complete and current'], ['Policy Compliance', 'Applies HR policies consistently'], ['Confidentiality', 'Protects personal information (POPIA)'], ['Service to Staff', 'Responds to HR queries promptly'], ['Continuous Improvement', 'Identifies and fixes process gaps']],
    'Management': [['Strategic Delivery', 'Department plan delivered'], ['People Leadership', 'Team supported, developed and reviewed'], ['Budget Management', 'Department spends within budget'], ['Stakeholder Relations', 'Builds trust with funders and partners'], ['Risk & Compliance', 'Department risks identified and managed']]
  };
  const SCALE = ['5 Exceptional', '4 Highly Effective', '3 Proficient', '2 Needs Improvement', '1 Unsatisfactory'];
  const RATING_CLS = r => r.startsWith('5') || r.startsWith('4') ? 'g' : r.startsWith('3') ? 'b' : r.startsWith('Not') ? 'a' : 'r';
  let PV = { personId: 'p5', lib: 'Programme / Field', scores: {} };
  Pages.performance = {
    title: 'Performance',
    render() {
      const s = S(), p = St.person(PV.personId);
      const kpas = LIBS[PV.lib];
      const sc = PV.scores;
      const pip = s.pips.find(x => x.status === 'Open');
      const checks = ['KPAs selected from approved KPA library', '5–8 KPAs selected per role', 'KPAs aligned to job description', 'KPAs discussed and agreed with employee', 'KPAs documented before review period starts', 'SMART indicators agreed where applicable', 'Signed acknowledgement on file'];
      const flow = [['Set KPAs', '5–8 from the role KPA library, agreed and signed before the period'], ['Ongoing feedback', 'Supervision, timely and documented'], ['Formal review', 'HR-07 Review Form, scale 1–5'], ['Informal support', 'Discussion, coaching, training'], ['PIP', 'If no improvement · HR-07-FRM-01'], ['Escalate', 'Persistent or wilful → HR-03 discipline']];

      ${header('Performance', 'HR-07 Performance Management Policy · the direct manager completes the HR-07 form; HR captures it here (managers have no PERSAL login)', `<button class="btn pri" onclick="A.pfCycle()">+ Start review cycle</button>`)}
