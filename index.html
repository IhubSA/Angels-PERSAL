<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angels PERSAL · People & Payroll Hub</title>
<meta name="description" content="Angels Resource Centres — PERSAL People & Payroll Hub (test system)">
<meta name="theme-color" content="#1F4E8C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Angels PERSAL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%231F4E8C%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2244%22%20font-family%3D%22Arial%2C%20sans-serif%22%20font-size%3D%2234%22%20font-weight%3D%22800%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3EA%3C/text%3E%3C/svg%3E%0A" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Angels PERSAL · People & Payroll Hub — styles taken from the design artifact */
:root{
  --brand:#1F4E8C; --brand-dark:#163A69; --ink:#16213A; --ink2:#3A4459; --muted:#5B6478; --muted2:#8A93A6;
  --bg:#F3F5F9; --line:#E3E7EE; --line2:#EEF1F5; --field:#D5DBE5;
  --g-bg:#E3F4EC; --g:#1E7A4F; --a-bg:#FFF3D9; --a:#8A5800; --b-bg:#E8EFF8; --b:#1F4E8C;
  --p-bg:#F1EAFB; --p:#6B3FA0; --r-bg:#FDECEA; --r:#B42318; --x-bg:#EEF1F5; --x:#5B6478;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}a:hover{color:var(--brand-dark)}
button,input,select,textarea{font-family:inherit}
.m{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace}
.muted{color:var(--muted)} .small{font-size:12px} .xs{font-size:11px}
.hidden{display:none!important}

/* Layout */
.shell{display:flex;min-height:100vh;align-items:stretch}
.side{width:260px;flex:none;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brandrow{display:flex;align-items:center;gap:10px;padding:0 8px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.side .grp{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding:12px 12px 4px}
.side a.nav{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink2);padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600}
.side a.nav:hover{background:#EEF2F8}
.side a.nav.on{background:var(--brand);color:#fff}
.side a.nav .code{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted2)}
.side a.nav.on .code{color:#C9D6EA}
.side a.nav .badge{margin-left:6px;background:var(--r);color:#fff;border-radius:99px;font-size:10px;padding:1px 7px;font-weight:800}
.whoami{margin-top:18px;padding:12px;border-radius:12px;background:var(--bg);font-size:12px;color:var(--muted)}
.whoami select{width:100%;margin-top:8px;padding:8px 10px;border:1px solid var(--field);border-radius:8px;background:#fff;font-size:13px;font-weight:700;color:var(--ink)}
.main{flex:1;min-width:0;padding:28px 32px 60px;display:flex;flex-direction:column;gap:18px}
.topbar{display:none}
.wrap{max-width:1180px;margin:0 auto;width:100%}

/* Portal-style header (leave portal / risk tracker) */
.phead{background:#fff;border-bottom:1px solid var(--line)}
.phead .in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pmain{max-width:1180px;margin:0 auto;padding:24px 24px 130px;display:flex;flex-direction:column;gap:18px}

/* Headings */
.ph{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.ph h1{margin:0;font-size:28px;font-weight:800}
.ph p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:820px}
.crumb{font-size:13px;color:var(--muted)} .crumb a{text-decoration:none}
.h2{margin:0 0 14px;font-size:17px;font-weight:800}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Cards & grids */
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.pad{padding:18px 20px}
.card.warn{background:#FFFBF1;border-color:#F1DDA8}
.grid{display:grid;gap:16px;align-items:start}
.g-tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(400px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tile{padding:16px 18px;text-decoration:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
a.tile:hover{border-color:#BFD0E8}
.tile .l{font-size:13px;font-weight:700;color:var(--muted)}
.tile .v{font-size:28px;font-weight:800}
.tile .s{font-size:12px;color:var(--muted)}
.box{background:var(--bg);border-radius:12px;padding:12px}
.note{font-size:12px;padding:10px 12px;border-radius:10px;background:#FFFBF1;border:1px solid #F1DDA8}
.info{font-size:13px;padding:12px 16px;border-radius:12px;background:var(--b-bg);color:#163A69}
.dark{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;flex-wrap:wrap}
.flag{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;font-size:13px}
.flag .dot{width:8px;height:8px;border-radius:99px;flex:none}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:var(--brand)}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5}
.list-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px}
.list-row:last-child{border-bottom:0}

/* Tables */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.nw,.tbl.nw td{white-space:nowrap}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#F7F9FD}
.tbl tr.sel td{background:#F3F7FC}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}

/* Pills & chips */
.pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.g{background:var(--g-bg);color:var(--g)}.pill.a{background:var(--a-bg);color:var(--a)}.pill.b{background:var(--b-bg);color:var(--b)}
.pill.p{background:var(--p-bg);color:var(--p)}.pill.r{background:var(--r-bg);color:var(--r)}.pill.x{background:var(--x-bg);color:var(--x)}
.chip{font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 8px;border-radius:6px;background:var(--x-bg);color:var(--ink2);border:1px dashed #B9C2D0;cursor:pointer}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:10px 16px;border-radius:10px;cursor:pointer;min-height:42px;text-decoration:none;border:1px solid var(--field);background:#fff;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#B9C2D0;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-dark);color:#fff}
.btn.ok{background:var(--g);border-color:var(--g);color:#fff}
.btn.warn{border-color:#D9A93C;color:var(--a)}
.btn.bad{border-color:#E8A39C;color:var(--r)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:700;cursor:pointer;font-size:13px}
.seg{display:inline-flex;gap:4px;padding:4px;background:#E6EAF1;border-radius:12px;flex-wrap:wrap;align-self:flex-start}
.seg button{border:0;border-radius:10px;padding:9px 18px;font-size:14px;font-weight:800;cursor:pointer;background:transparent;color:var(--muted);min-height:40px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--ink2)}
.tabs button.on{background:var(--b-bg);color:var(--b);border-color:#BFD0E8}

/* Forms */
.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea,input.in,select.in{font-size:14px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:#fff;color:var(--ink);font-weight:500;width:100%}
.f textarea{min-height:80px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus,input.in:focus,select.in:focus{outline:2px solid #BFD0E8;border-color:var(--brand)}
.f .err{color:var(--r);font-weight:600}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fg .full{grid-column:1/-1}
.filters{padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
input.sc{width:56px;text-align:center;padding:8px;border:1px solid var(--field);border-radius:8px;font-size:14px;font-weight:700}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--brand)}
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:30px 20px;border:2px dashed #B9C8DE;border-radius:14px;background:#F7F9FD;cursor:pointer}
.drop.over{background:var(--b-bg);border-color:var(--brand)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Key/value */
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;margin:0}
.kv dt{font-size:12px;font-weight:700;color:var(--muted)}
.kv dd{margin:3px 0 0;font-size:14px;font-weight:600;word-break:break-word}
.kv .full{grid-column:1/-1}

/* Flow steps */
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.flow li{border-radius:12px;padding:12px;background:#F7F9FD;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.flow li.done{background:#F2FAF6;border-color:#BFE3CF}.flow li.now{background:#FFF8E8;border-color:#F1DDA8}
.flow .n{width:24px;height:24px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.flow li.done .n{background:var(--g)}.flow li.now .n{background:var(--a)}.flow li.next .n{background:var(--muted2)}
.flow .st{font-size:11px;font-weight:800;text-transform:uppercase}
.flow li.done .st{color:var(--g)}.flow li.now .st{color:var(--a)}.flow li.next .st{color:var(--muted2)}
.flow .t{font-size:14px;font-weight:800}.flow .d{font-size:12px;color:var(--muted)}

/* Timeline */
.tl{display:flex;flex-direction:column}
.tl>div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2)}
.tl>div:last-child{border-bottom:0}
.tl .dot{width:10px;height:10px;margin-top:5px;border-radius:99px;background:var(--brand);flex:none}

/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(22,33,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:#fff;border-radius:16px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.modal header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal header h3{margin:0;font-size:18px;font-weight:800}
.modal .body{padding:18px 22px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:380px;animation:tin .2s ease-out}
.toast.ok{background:var(--g)}.toast.bad{background:var(--r)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.demo-bar{background:#16213A;color:#C9D2E3;font-size:12px;padding:6px 14px;text-align:center}
.demo-bar b{color:#fff}
.demo-bar button{background:none;border:1px solid #3A4459;color:#fff;border-radius:6px;padding:2px 8px;margin-left:8px;cursor:pointer;font-size:12px}

/* Search */
.search{position:relative}
.search input{width:100%;padding:9px 12px;border:1px solid var(--field);border-radius:10px;font-size:13px}
.search .res{position:absolute;left:0;right:0;top:42px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:30;max-height:320px;overflow:auto}
.search .res a{display:block;padding:9px 12px;text-decoration:none;color:var(--ink);font-size:13px;border-bottom:1px solid var(--line2)}
.search .res a:hover{background:#F3F7FC}

/* Responsive: tablets and phones */
html{-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
.backdrop{display:none}
.roleswitch{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 6px 20px rgba(0,0,0,.08);font-size:12px;max-width:calc(100vw - 28px)}
.seg{max-width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;flex:none}
.tw{-webkit-overflow-scrolling:touch}

/* Tablets (portrait / small laptops) */
@media (max-width:1180px){
  .side{width:224px;padding:16px 10px}
  .main{padding:22px 20px 60px}
  .g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
}

/* Phones and tablets in portrait: sliding menu */
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;height:100%;z-index:45;width:min(300px,86vw);transform:translateX(-105%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.25);padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .side.open{transform:none}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(22,33,58,.45);z-index:44;opacity:0;pointer-events:none;transition:opacity .2s}
  .backdrop.on{opacity:1;pointer-events:auto}
  .side a.nav{padding:12px;font-size:15px}
  .topbar{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));position:sticky;top:0;z-index:20}
  .shell{flex-direction:column}
  .main{padding:16px 14px 70px;gap:14px}
  .g-2,.g-3{grid-template-columns:1fr}
  .g-tiles{grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
  .ph{align-items:flex-start}
  .ph h1{font-size:22px}
  .ph p{font-size:13px}
  .ph>.row{width:100%}
  .ph>.row .btn{flex:1 1 auto}
  .h2{font-size:16px}
  .pad{padding:14px 14px}
  .filters{padding:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .flow{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .tile{padding:14px}
  .tile .v{font-size:24px}
  .btn{min-height:44px}
  .btn.sm{min-height:38px}
  /* 16px inputs stop phones zooming in when you tap a field */
  .f input,.f select,.f textarea,input.in,select.in,.search input,.whoami select{font-size:16px}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column}
  .modal .body{overflow-y:auto;padding:16px}
  .modal footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:#fff}
  .modal footer .btn{flex:1}
  #toasts{left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom))}
  .toast{max-width:none}
  .phead .in{padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
  .pmain{padding:16px 14px 150px}
  .demo-bar .hide-sm{display:none}
}

/* Phones: tables become stacked cards, forms one column */
@media (max-width:640px){
  .fg,.kv{grid-template-columns:1fr}
  .g-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile .l{font-size:12px}
  .tile .s{font-size:11px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:6px 12px;background:#fff}
  .tbl tr.sel{border-color:var(--brand)}
  .tbl td{border:0!important;padding:6px 0!important;display:flex;gap:12px;justify-content:space-between;align-items:flex-start;text-align:right;white-space:normal!important;min-width:0!important}
  .tbl td::before{content:attr(data-label);flex:none;max-width:45%;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:2px}
  .tbl td:not([data-label])::before,.tbl td[data-label=""]::before{display:none}
  .tbl td:not([data-label]),.tbl td[data-label=""]{justify-content:flex-end}
  .tbl td>*{max-width:100%}
  .tbl td:first-child{font-size:14px}
  .tw{overflow:visible}
  .card[style*="padding:6px 8px"]{padding:8px!important;background:transparent;border:0}
  .roleswitch{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom))}
  .roleswitch select{width:100%}
  .list-row{flex-wrap:wrap}
  .ph h1{font-size:20px}
  .seg button{padding:8px 14px;font-size:13px}
}
@media print{.side,.topbar,.demo-bar,.btn{display:none!important}.main{padding:0}}

</style>
</head>
<body>
<div class="demo-bar"><b>Test system</b><span class="hide-sm"> · sample data only, saved on this device · switch roles in the menu to test approvals</span><button onclick="A.resetData()">Reset demo data</button></div>
<div id="app"><div class="empty">Loading…</div></div>
<div id="toasts" aria-live="polite"></div>
<noscript><p style="padding:20px">Angels PERSAL needs JavaScript to run.</p></noscript>
<script>/* js/store.js */
/* Angels PERSAL — data store, sample data and business rules.
   All data lives in the browser (localStorage) so testers can try the system safely.
   Use "Reset demo data" in the sidebar to start again. */
(function () {
  const KEY = 'angels-persal-v1';
  const TODAY = new Date();

  /* ---------- small helpers ---------- */
  const pad = n => String(n).padStart(2, '0');
  const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

    s.at = todayIso(); s.by = me().name; s.comment = comment || '';
    if (decision === 'approve') {
      s.state = 'done';
      const idx = req.route.indexOf(s);
      if (req.route[idx + 1]) { req.route[idx + 1].state = 'now'; log('Approved', subjectLabel(req), 'Step ' + (idx + 1) + ' approved: ' + STEP_LABEL[s.role], req.no); }
      else finalise(req);
    } else if (decision === 'return') {
      s.state = 'returned'; req.status = 'Returned'; req.returnComment = comment;
      log('Returned', subjectLabel(req), 'Returned for revision: ' + comment, req.no);
    } else {
      s.state = 'declined'; req.status = 'Declined'; req.returnComment = comment;
      log('Declined', subjectLabel(req), 'Declined: ' + comment, req.no);
    }
    save();
  }
  function resubmit(req, note) {
    req.status = 'Pending';
    const s = req.route.find(x => x.state === 'returned');
    if (s) { s.state = 'now'; s.comment = ''; }
    req.history.push({ at: todayIso(), note: 'Resubmitted: ' + (note || '') });
    log('Changed', subjectLabel(req), 'Resubmitted after return', req.no);
    save();
  }
  const subjectLabel = req => req.personId ? nameOf(req.personId) : (req.subjectName || '—');

  /* Final approval: apply the effect to the records. Approved = record. */
  function finalise(req) {
    req.status = 'Approved'; req.approvedAt = todayIso();
    const d = req.data || {}, p = req.personId ? person(req.personId) : null;
    let effect = '';
    switch (req.code) {
      case '1.1': {
        if (d.action === 'Fund' && d.postNo) { const ps = postOf(d.postNo); if (ps) { ps.status = ps.inc ? 'Filled' : 'Vacant funded'; if (d.funder) ps.funder = d.funder; effect = 'Post ' + d.postNo + ' funded'; } }
        else if (d.action === 'Close' && d.postNo) { const ps = postOf(d.postNo); if (ps) { ps.status = 'Closed'; effect = 'Post ' + d.postNo + ' closed'; } }
        else { const no = d.no || String(Number(S.posts.reduce((m, x) => Math.max(m, Number(x.no)), 0)) + 1).padStart(7, '0'); S.posts.push({ no, title: d.title, dept: d.dept, cat: d.cat, level: d.level, cc: d.cc, funder: d.funder, status: d.funded ? 'Vacant funded' : 'Unfunded', inc: null, dm: d.dm || '—', fm: d.fm || '—' }); effect = 'Post ' + no + ' created'; }
        break;
      }
      case '2.2': {
        let np = p;
        if (!np) {
          const id = 'p' + (S.people.length + 1 + Math.floor(Math.random() * 1000));
          const ps = postOf(d.postNo);
          np = { id, first: d.first, last: d.last, cat: d.cat || 'Permanent', dept: ps ? ps.dept : '', postNo: d.postNo, title: ps ? ps.title : '', dm: managerForPost(ps), status: 'Active', persal: null, start: d.start || req.effective, signed: todayIso(), email: (d.first + '.' + d.last).toLowerCase().replace(/[^a-z.]/g, '') + '@angelsinc.co.za', cell: '', idNo: '', taxNo: '', bank: '', acct: '', salary: Number(d.salary) || 0, level: ps ? ps.level : '', step: Number(d.step) || 1, lastIncrease: '', placedWith: 'Angels', endDate: d.endDate || '', probation: 'In progress', reviews: { d30: false, d60: false, d90: false }, kin: '', address: '', eea: { level: '', gender: '', race: '', disability: '', nationality: '' }, leave: { annual: 0, sick: 30, family: 3, overtime: 0, expiring: 0, expiryDate: '' }, attendance: 'Jibble', fm: '' };
          S.people.push(np); req.personId = id;
          if (ps) { ps.status = 'Filled'; ps.inc = id; }
          S.lifecycle.unshift({ id: uid('lc'), kind: 'Onboarding', personId: id, meta: (ps ? ps.title + ' · ' + ps.dept : '') + ' · starts ' + fmtDate(np.start), tasks: defaultTasks('Onboarding') });
          // Mark applicant as appointed if matching
          S.applicants.filter(a => a.name === d.first + ' ' + d.last).forEach(a => { a.st = 'Appointed'; a.last = 'Appointed (' + req.no + ')'; });
        }
        if (!np.persal) np.persal = newPersal();
        effect = 'PERSAL number ' + np.persal + ' issued';
        break;
      }
      case '2.3': if (p) { if (d.endDate) p.endDate = d.endDate; if (d.action === 'End') p.status = 'Exited'; if (!p.persal) p.persal = newPersal(); effect = 'Agreement ' + (d.action || 'updated').toLowerCase() + (d.endDate ? ' · end ' + fmtDate(d.endDate) : ''); } break;
      case '2.4': if (p) { p.probation = d.outcome === 'Confirm' ? 'Completed ' + fmtDate(todayIso()) : d.outcome === 'Extend' ? 'Extended to ' + fmtDate(d.until) : 'Terminated'; if (d.outcome === 'Terminate') p.status = 'Exited'; effect = 'Probation: ' + d.outcome; } break;
      case '3.4': if (p) { S.leave.unshift({ no: nextNo('LV', '27'), personId: p.id, type: d.type, from: d.from, to: d.to, days: workingDays(d.from, d.to), note: 'Paper form HR-06-FRM-01 (' + req.no + ')', status: 'Approved', reason: '', submitted: todayIso(), decidedBy: 'Direct manager (paper)' }); deductLeave(p, d.type, workingDays(d.from, d.to)); effect = 'Leave captured'; } break;
      case '3.6': if (p) { const k = leaveKey(d.type); p.leave[k] = round2((p.leave[k] || 0) + Number(d.days || 0)); effect = d.type + ' balance adjusted by ' + d.days; } break;
      case '3.7': {
        const c = S.closures.find(x => x.y === d.y) || (S.closures.push({ y: d.y }), S.closures[S.closures.length - 1]);
        c.from = d.from; c.to = d.to; c.st = 'Approved';
        const n = workingDays(d.from, d.to);
        S.people.filter(x => isEmployee(x) && x.status === 'Active').forEach(x => { x.leave.annual = round2(x.leave.annual - n); });
        effect = 'Closure booked: ' + n + ' leave days for every employee'; break;
      }
      case '4.2': if (p) { if (d.newSalary) p.salary = Number(d.newSalary); if (d.newStep) p.step = Number(d.newStep); p.lastIncrease = req.effective || todayIso(); effect = 'Salary now ' + money(p.salary); } break;
      case '4.3': if (p) { if (d.newLevel) p.level = d.newLevel; if (d.newStep) p.step = Number(d.newStep); if (d.newSalary) p.salary = Number(d.newSalary); effect = 'Regraded to ' + p.level; } break;
      case '4.9': if (p) { p.bank = d.bank; p.acct = d.acct; effect = 'Banking details updated'; } break;
      case '5.1': if (p) {
        p.status = 'Exited'; p.exitDate = d.lastDay; p.exitReason = d.reason;
        const ps = postOf(p.postNo); if (ps && ps.inc === p.id) { ps.status = 'Vacant funded'; ps.inc = null; }
        S.lifecycle.unshift({ id: uid('lc'), kind: 'Exit', personId: p.id, meta: d.reason + ' · last working day ' + fmtDate(d.lastDay), tasks: defaultTasks('Exit') });
        effect = 'Record closed; PERSAL number locked (never reused)';
      } break;
      case '5.2': if (p) { p.status = 'Suspended'; effect = 'Suspended pending investigation'; } break;
      case '9.9': { const orig = S.requests.find(x => x.no === d.reverses); if (orig) { orig.reversedBy = req.no; effect = orig.no + ' reversed'; } break; }
      case '3.8': { const lv = S.leave.find(x => x.no === d.leaveNo); if (lv) lv.payrollSent = true; effect = 'Sent to SimplePay'; break; }
      default: effect = 'Approved';
    }
    req.effect = effect;
    log('Approved', subjectLabel(req), 'Final approval · ' + effect, req.no);
  }
  function managerForPost(ps) {
    if (!ps) return null;
    const m = { 'CEO': 'p1', 'HOD HR': 'p9', 'NOC': 'p4', 'Head of Ops & Systems': 'p3', 'PA to the CEO': 'p2', 'Marketing HOD': 'p7' };
    return m[ps.dm] || null;

  function defaultTasks(kind) {
    const on = [['Appointment approved (2.2) · PERSAL number issued', 'HR', 'Before start', 'Done'], ['Signed offer letter and contract on file', 'HR', 'Before start', 'Not started'], ['ID, qualifications, POPIA consent, EEA1 form', 'New starter → HR', 'Before start', 'Not started'], ['Banking details verified', 'Head of Finance', 'Before first pay', 'Not started'], ['Added to SimplePay for salary', 'Head of Finance', 'Before first pay', 'Not started'], ['Microsoft 365 account, Teams, leave portal access', 'IT', 'Day 1', 'Not started'], ['Added to Jibble', 'HR', 'Day 1', 'Not started'], ['Laptop and equipment issued (asset register)', 'Logistics Factotum', 'Day 1', 'Not started'], ['Code of Conduct and Leave Policy acknowledged', 'New starter', 'Week 1', 'Not started'], ['30 / 60 / 90-day reviews scheduled', 'Direct manager', 'Week 1', 'Not started']];
    const ex = [['Termination request approved (5.1) with reason', 'Direct manager → HOD HR → HOF → CEO', 'On notice', 'Done'], ['Leave balance frozen; unused days calculated', 'HR', 'On notice', 'Not started'], ['Final pay instruction incl. leave payout to SimplePay', 'Head of Finance', 'Last pay run', 'Not started'], ['Laptop, keys and equipment returned', 'Logistics Factotum', 'Last day', 'Not started'], ['Handover of work and files', 'Direct manager', 'Last day', 'Not started'], ['Microsoft 365, leave portal and Jibble access removed', 'IT / HR', 'Last day', 'Not started'], ['Certificate of service (BCEA s42)', 'HR', 'Last day', 'Not started'], ['UI-19 form for UIF', 'HR', 'Within 14 days', 'Not started'], ['Exit interview (survey tool)', 'HR', 'Last week', 'Not started'], ['Record closed; PERSAL number locked', 'HOD HR', 'After final pay', 'Not started']];
    return (kind === 'Exit' ? ex : on).map(([t, o, d, st]) => ({ t, o, d, st }));
  }

  /* ---------- leave ---------- */
  const round2 = n => Math.round(n * 100) / 100;
  const leaveKey = t => ({ 'Annual': 'annual', 'Sick': 'sick', 'Family responsibility': 'family', 'Time off for overtime': 'overtime' })[t];
  function deductLeave(p, type, days) { const k = leaveKey(type); if (k) p.leave[k] = round2((p.leave[k] || 0) - days); }
  function applyLeave(personId, type, from, to, note, hasCert) {
    const p = person(personId);
    const days = workingDays(from, to);
    const lv = { no: nextNo('LV', '27'), personId, type, from, to, days, note: note || '', status: 'With manager', reason: '', submitted: todayIso(), decidedBy: '', certificate: !!hasCert };
    // HODs go to the CEO; CEO to the Board
    lv.approver = p.dm || 'board';
    S.leave.unshift(lv);
    log('Changed', fullName(p), 'Leave applied: ' + type + ' ' + fmtShort(from) + '–' + fmtShort(to) + ', ' + days + ' days', lv.no);
    return lv;
  }
  function decideLeave(lv, ok, reason) {
    const p = person(lv.personId);
    lv.status = ok ? 'Approved' : 'Declined'; lv.reason = reason || ''; lv.decidedBy = me().name; lv.decidedAt = todayIso();
    if (ok) {

        req.route = buildRoute('3.8', req); S.requests.unshift(req); lv.payroll = req.no;
      }
    }
    log(ok ? 'Approved' : 'Declined', fullName(p), lv.type + ' leave ' + fmtShort(lv.from) + '–' + fmtShort(lv.to) + ', ' + lv.days + ' days' + (reason ? ' · ' + reason : ''), lv.no);
    save();
  }

  /* ---------- risks ---------- */
  const riskLevel = s => s >= 20 ? 'Critical' : s >= 12 ? 'High' : s >= 6 ? 'Medium' : 'Low';
  const RISK_CLASS = { Critical: 'r', High: 'a', Medium: 'a', Low: 'g' };

  window.Store = {
    get S() { return S; }, load, save, reset, seed,
    ROLES, STEP_LABEL, STEP_WHO, CODES, code, DEPTS, CATS, FUNDERS, PAID, LEAVE_TYPES, DOC_TYPES, DOC_CODE, EMPLOYEE_CATS,
    person, personByPersal, nameOf, fullName, postOf, reports, isEmployee, me, nextNo, log,
    createRequest, currentStep, canAct, decide, resubmit, finalise, subjectLabel,
    applyLeave, decideLeave, deductLeave, leaveKey, workingDays, holidayName, holidays,
    luhnDigit, validPersal, newPersal, riskLevel, RISK_CLASS, defaultTasks,
    iso, todayIso, addDays, fmtDate, fmtShort, fmtTime, money, money0, uid, round2
  };
})();

<script>/* js/ui.js */
/* Angels PERSAL — UI helpers, app shell and router */
(function () {
  const St = window.Store;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const attr = esc;
  const pill = (t, c) => `<span class="pill ${c || 'x'}">${esc(t)}</span>`;
  const STATUS_CLASS = {
    'Approved': 'g', 'Done': 'g', 'Verified': 'g', 'Filled': 'g', 'Active': 'g', 'On file': 'g', 'Signed': 'g', 'Agreed': 'g', 'Passed': 'g', 'Ready': 'g', 'Closed': 'x', 'Covered': 'g', 'Indexed': 'g', 'Running': 'g', 'On track': 'g', 'Appointed': 'g', 'Offer accepted': 'g',
    'Pending': 'b', 'With manager': 'a', 'To verify': 'a', 'In progress': 'a', 'Vacant funded': 'a', 'Differences': 'a', 'Check': 'a', 'Open': 'a', 'Interviews': 'a', 'Interview': 'a', 'Suspended': 'r',
    'Returned': 'r', 'Declined': 'r', 'Missing': 'r', 'Disputed': 'r', 'Fix': 'r', 'Exited': 'x', 'Unfunded': 'x', 'Not started': 'x', 'Not set': 'a', 'Checking': 'b', 'New': 'b', 'Shortlisted': 'p', 'Offer': 'g', 'Not progressed': 'x', 'Reported': 'b', 'Action in progress': 'a'
  };
  const spill = t => pill(t, STATUS_CLASS[t] || (String(t).startsWith('Rejected') ? 'r' : 'x'));

  /* ---------- toasts & modals ---------- */
  function toast(msg, kind) {
    const el = document.createElement('div'); el.className = 'toast ' + (kind || ''); el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }
  function modal(title, body, buttons, opts) {
    opts = opts || {};
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${attr(title)}"><header><h3>${esc(title)}</h3><button class="x" aria-label="Close">×</button></header><div class="body">${body}</div><footer></footer></div>`;
    const close = () => { bg.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    bg.querySelector('.x').onclick = close;
    bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
    const foot = bg.querySelector('footer');
    (buttons || [{ label: 'Close' }]).forEach(b => {
      const btn = document.createElement('button'); btn.className = 'btn ' + (b.cls || ''); btn.textContent = b.label;

      foot.appendChild(btn);
    });
    document.body.appendChild(bg);
    const first = bg.querySelector('input,select,textarea'); if (first) setTimeout(() => first.focus(), 30);
    if (opts.onOpen) opts.onOpen(bg.querySelector('.modal'));

  }
  const val = (root, name) => { const el = root.querySelector(`[name="${name}"]`); if (!el) return ''; if (el.type === 'checkbox') return el.checked; return el.value.trim(); };
  function need(root, names) {
    let ok = true;
    root.querySelectorAll('.err').forEach(e => e.remove());
    names.forEach(n => {
      const el = root.querySelector(`[name="${n}"]`);
      if (el && !el.value.trim()) { ok = false; const e = document.createElement('span'); e.className = 'err'; e.textContent = 'Required'; el.parentNode.appendChild(e); }
    });
    if (!ok) toast('Please fill in the required fields', 'bad');
    return ok;
  }
  const opt = (v, label, sel) => `<option value="${attr(v)}" ${sel ? 'selected' : ''}>${esc(label == null ? v : label)}</option>`;
  const opts = (arr, sel) => arr.map(x => typeof x === 'object' ? opt(x.v, x.l, x.v === sel) : opt(x, x, x === sel)).join('');
  const peopleOpts = (sel, filter) => St.S.people.filter(filter || (p => p.status !== 'Exited')).map(p => opt(p.id, St.fullName(p) + (p.persal ? ' · ' + p.persal : ''), p.id === sel)).join('');

  /* ---------- CSV ---------- */
  function csv(rows) { return rows.map(r => r.map(c => { const s = String(c == null ? '' : c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }
  function download(name, text, type) {
    const blob = new Blob([text], { type: type || 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function parseCsv(text) {
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  /* ---------- navigation ---------- */
  const CORE = ['hradmin', 'hodhr', 'hof', 'ceo'];
  const NAV = [
    { grp: 'Overview' },
    { r: 'dashboard', label: 'Dashboard', code: '0.0', roles: CORE },

    { r: 'programmes', label: 'Internships & bursaries', code: '1.6', roles: CORE },
    { grp: 'People' },
    { r: 'people', label: 'People', code: '2.1', roles: CORE },
    { r: 'import', label: 'Staff import', code: '2.2', roles: ['hradmin', 'hodhr'] },
    { r: 'lifecycle', label: 'Onboarding & exits', code: '2.4', roles: CORE },

    { grp: 'Leave & performance' },
    { r: 'leave', label: 'Leave', code: '3.0', roles: CORE },
    { r: 'leaveimport', label: 'Leave history import', code: '3.2', roles: ['hradmin', 'hodhr', 'hof'] },
    { r: 'performance', label: 'Performance', code: '3.5', roles: ['hradmin', 'hodhr', 'ceo'] },
    { grp: 'Requests' },
    { r: 'payroll', label: 'Payroll instructions', code: '4.0', roles: CORE },
    { r: 'approvals', label: 'Approvals', code: '6.0', roles: CORE.concat(['board']), badge: true },
    { r: 'relations', label: 'Discipline & grievance', code: '5.5', roles: ['hradmin', 'hodhr'] },
    { grp: 'Governance' },
    { r: 'policies', label: 'Policies & compliance', code: '8.0', roles: CORE },
    { r: 'reports', label: 'Reports', code: '7.0', roles: CORE },
    { r: 'access', label: 'Roles & access', code: '9.0', roles: CORE },
    { r: 'audit', label: 'Audit log', code: '9.1', roles: ['hodhr', 'hradmin', 'ceo'] },
    { grp: 'Other apps' },
    { r: 'portal', label: 'Leave portal ↗', code: '3.1', roles: CORE.concat(['board']) },
    { r: 'risktracker', label: 'Risk tracker ↗', code: '8.2', roles: ['hodhr'] }
  ];
  const routeAlias = { person: 'people', request: 'approvals' };

  const Pages = {};
  function canSee(route) {
    const role = St.S.role, app = St.ROLES[role].app;
    if (app === 'portal') return route === 'portal';
    if (app === 'risk') return route === 'risktracker';
    const n = NAV.find(x => x.r === (routeAlias[route] || route));
    return n ? n.roles.includes(role) : true;
  }
  function homeFor(role) { const app = St.ROLES[role].app; return app === 'portal' ? 'portal' : app === 'risk' ? 'risktracker' : role === 'board' ? 'approvals' : 'dashboard'; }

  function parseHash() { const h = (location.hash || '').replace(/^#\/?/, ''); const [r, ...rest] = h.split('/'); return { r: r || '', params: rest.map(decodeURIComponent) }; }
  function go(path) { location.hash = '#/' + path; }

  function pendingForMe() { return St.S.requests.filter(r => St.canAct(r)).length; }

  function sidebar(active) {
    const role = St.S.role, R = St.ROLES;
    const items = NAV.filter(n => n.grp || n.roles.includes(role));
    // drop empty groups
    const out = []; items.forEach((n, i) => { if (n.grp && (!items[i + 1] || items[i + 1].grp)) return; out.push(n); });
    const pend = pendingForMe();
    return `<nav class="side" id="side" aria-label="People Hub menu">
      <div class="brandrow"><div class="logo">A</div><div><div style="font-weight:800;font-size:16px">Angels PERSAL</div><div class="small muted">People &amp; Payroll Hub</div></div></div>
      <div class="search" style="margin:0 4px 8px"><input id="gsearch" placeholder="Search people, posts, requests…" aria-label="Search" autocomplete="off"><div class="res hidden" id="gres"></div></div>
      ${out.map(n => n.grp ? `<div class="grp">${esc(n.grp)}</div>` : `<a class="nav ${active === n.r ? 'on' : ''}" href="#/${n.r}">${esc(n.label)}${n.badge && pend ? `<span class="badge">${pend}</span>` : ''}<span class="code">${n.code}</span></a>`).join('')}
      ${roleBox()}
    </nav>`;
  }
  function roleBox() {
    const R = St.ROLES, cur = St.S.role;
    return `<div class="whoami">Signed in as<br><strong style="color:var(--ink)">${esc(R[cur].name)}</strong><br>${esc(R[cur].label)}
      <label class="small" style="display:block;margin-top:10px;font-weight:700">Switch test role

        <button class="btn sm bad" onclick="A.resetData()">Reset demo</button>
      </div>${window.Install && Install.available() ? `<button class="btn pri sm" style="width:100%;margin-top:8px" onclick="Install.prompt()">⬇ Install the app</button>` : ''}</div>`;
  }

  function render() {
    const { r, params } = parseHash();
    document.body.style.overflow = '';
    const role = St.S.role;
    document.documentElement.style.setProperty('--brand', St.S.brand || '#1F4E8C');
    let route = r || homeFor(role);
    if (!Pages[route]) route = homeFor(role);
    if (!canSee(route)) { route = homeFor(role); if (location.hash !== '#/' + route) { history.replaceState(null, '', '#/' + route); } }
    const page = Pages[route];
    const app = document.getElementById('app');
    let content;
    try { content = page.render.apply(null, params); }
    catch (e) { console.error(e); content = `<div class="card pad"><h2 class="h2">Something went wrong</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="A.resetData()">Reset demo data</button></div>`; }
    if (page.standalone) {
      app.innerHTML = content + standaloneSwitch();
    } else {
      const activeNav = page.nav || routeAlias[route] || route;
      const inst = window.Install && Install.available();
      app.innerHTML = `<div class="topbar"><button class="btn sm" onclick="A.menu(true)" aria-label="Open menu">☰</button><div class="logo" style="width:30px;height:30px">A</div><strong style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(page.title || 'Angels PERSAL')}</strong>${inst ? `<button class="btn sm" onclick="Install.prompt()" aria-label="Install app">⬇ Install</button>` : ''}</div>
        <div class="backdrop" id="backdrop" onclick="A.menu(false)"></div>
        <div class="shell">${sidebar(activeNav)}<main class="main" id="main">${content}</main></div>`;
    }
    document.title = (page.title || 'Angels PERSAL') + ' · Angels PERSAL';
    wireShell();
    if (page.after) page.after.apply(null, params);
    labelTables();
    const m = document.getElementById('main'); if (m && !A._keepScroll) window.scrollTo(0, 0);
    A._keepScroll = false;
  }
  function standaloneSwitch() {
    const R = St.ROLES, cur = St.S.role;
    return `<div class="roleswitch">
      <label style="font-weight:700;color:var(--muted)">Test role <select id="roleSel" class="in" style="margin-top:4px;padding:6px 8px;font-size:13px">${Object.keys(R).map(k => opt(k, R[k].label + ' · ' + R[k].name, k === cur)).join('')}</select></label>
      <div class="row" style="margin-top:6px;gap:10px">${R[cur].app === 'persal' ? `<a href="#/${homeFor(cur)}">← Back to PERSAL</a>` : ''}${window.Install && Install.available() ? `<button class="link" onclick="Install.prompt()">⬇ Install app</button>` : ''}</div></div>`;
  }
  function wireShell() {
    const sel = document.getElementById('roleSel');
    if (sel) sel.onchange = () => { St.S.role = sel.value; St.save(); St.log('Signed in', '—', 'Microsoft 365 sign-in (test role switch)'); toast('Now testing as ' + St.ROLES[sel.value].label); go(homeFor(sel.value)); render(); };
    const gs = document.getElementById('gsearch'), gr = document.getElementById('gres');
    if (gs) {
      gs.oninput = () => {
        const q = gs.value.trim().toLowerCase();
        if (q.length < 2) { gr.classList.add('hidden'); return; }
        const S = St.S, hits = [];
        S.people.forEach(p => { if ((St.fullName(p) + ' ' + (p.persal || '') + ' ' + p.title).toLowerCase().includes(q)) hits.push(`<a href="#/person/${p.id}">👤 ${esc(St.fullName(p))} <span class="muted small">· ${esc(p.title)} ${p.persal ? '· ' + p.persal : ''}</span></a>`); });
        S.posts.forEach(p => { if ((p.no + ' ' + p.title).toLowerCase().includes(q)) hits.push(`<a href="#/establishment">🗂 Post ${p.no} <span class="muted small">· ${esc(p.title)}</span></a>`); });
        S.requests.forEach(r => { if ((r.no + ' ' + St.code(r.code).t + ' ' + St.subjectLabel(r)).toLowerCase().includes(q)) hits.push(`<a href="#/request/${r.no}">📄 ${r.no} <span class="muted small">· ${esc(St.code(r.code).t.split(' · ')[0])} · ${esc(St.subjectLabel(r))}</span></a>`); });
        gr.innerHTML = hits.slice(0, 12).join('') || '<div class="empty">No matches</div>';
        gr.classList.remove('hidden');
      };
      gs.onblur = () => setTimeout(() => gr.classList.add('hidden'), 200);
    }
    document.querySelectorAll('.side a.nav').forEach(a => a.addEventListener('click', () => A.menu(false)));
    labelTables();
  }

  /* Phone layout: each table cell gets its column name so rows can show as cards */
  function labelTables() {
    document.querySelectorAll('table.tbl').forEach(t => {
      const heads = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
      t.querySelectorAll('tbody tr').forEach(tr => [...tr.children].forEach((td, i) => { if (heads[i] && !td.hasAttribute('colspan')) td.setAttribute('data-label', heads[i]); }));
    });
  }

  /* ---------- shared page bits ---------- */
  const header = (title, sub, actions) => `<div class="ph"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="row">${actions}</div>` : ''}</div>`;
  const tiles = arr => `<div class="grid g-tiles">${arr.map(t => `<${t.href ? 'a href="' + t.href + '"' : 'div'} class="card tile"><div class="between"><span class="l">${esc(t.l)}</span>${t.tag ? pill(t.tag, t.tc) : ''}</div><div class="v" style="color:${t.c || 'var(--ink)'}">${esc(t.v)}</div><div class="s">${esc(t.s || '')}</div></${t.href ? 'a' : 'div'}>`).join('')}</div>`;
  const flow = (title, steps, note) => `<section class="card pad">${title ? `<h2 class="h2">${esc(title)}</h2>` : ''}<ol class="flow">${steps.map((s, i) => `<li class="${s.state || ''}"><span class="row" style="gap:8px"><span class="n">${i + 1}</span>${s.state ? `<span class="st">${s.state === 'now' ? 'Now' : s.state === 'done' ? 'Done' : s.state === 'returned' ? 'Returned' : s.state === 'declined' ? 'Declined' : 'Next'}</span>` : ''}</span><span class="t">${esc(s.t)}</span><span class="d">${esc(s.d || '')}</span></li>`).join('')}</ol>${note ? `<p class="small muted" style="margin:12px 0 0">${note}</p>` : ''}</section>`;
  const table = (cols, rows, opts) => {
    opts = opts || {};
    if (!rows.length) return `<div class="empty">${opts.empty || 'Nothing to show yet'}</div>`;
    return `<div class="tw"><table class="tbl ${opts.nw ? 'nw' : ''}"><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  };
  const segs = (names, cur, fn) => `<div class="seg" role="tablist">${names.map((n, i) => `<button role="tab" class="${i === cur ? 'on' : ''}" onclick="${fn}(${i})">${esc(n)}</button>`).join('')}</div>`;
  const mask = (s, show) => show ? esc(s || '—') : (s ? '•'.repeat(Math.max(4, String(s).length - 4)) + esc(String(s).slice(-4)) : '—');

  /* ---------- global actions ---------- */
  const A = window.A = {
    go, render,
    menu(open) { const sd = document.getElementById('side'), bd = document.getElementById('backdrop'); if (sd) sd.classList.toggle('open', open); if (bd) bd.classList.toggle('on', open); document.body.style.overflow = open ? 'hidden' : ''; },
    refresh() { A._keepScroll = true; render(); },
    resetData() {
      modal('Reset demo data?', '<p style="margin:0">This removes every change you made while testing and loads the sample data again. It only affects this browser.</p>', [{ label: 'Cancel' }, { label: 'Reset', cls: 'bad', onClick: () => { St.reset(); toast('Demo data reset', 'ok'); go(homeFor(St.S.role)); render(); } }]);
    },
    exportData() { download('angels-persal-data-' + St.todayIso() + '.json', JSON.stringify(St.S, null, 2), 'application/json'); St.log('Exported', '—', 'Full test data export (JSON)'); },
    importData() {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; f.text().then(t => { try { const d = JSON.parse(t); if (!d.people || !d.requests) throw new Error('Not a PERSAL export'); localStorage.setItem('angels-persal-v1', JSON.stringify(d)); St.load(); toast('Data imported', 'ok'); render(); } catch (e) { toast('Could not import: ' + e.message, 'bad'); } }); };
      inp.click();
    }
  };

  window.UI = { esc, attr, pill, spill, toast, modal, val, need, opt, opts, peopleOpts, csv, download, parseCsv, header, tiles, flow, table, segs, mask, Pages, NAV, go, render, homeFor, canSee, STATUS_CLASS };
})();

<script>/* js/pages/org.js */
/* Dashboard · Post establishment · Grading · Recruitment · Internships & bursaries */
(function () {

  const S = () => St.S;
  const within = (dateStr, days) => { if (!dateStr) return false; const d = new Date(dateStr + 'T00:00:00'), now = new Date(); return d >= new Date(now.toDateString()) && (d - now) / 864e5 <= days; };

  const REQUIRED = ['Signed contract / SLA', 'Certified ID copy', 'POPIA consent', 'Bank confirmation letter'];

  window.Org = { missingDocs, REQUIRED, within, daysSince };

  /* ================= Dashboard ================= */
  Pages.dashboard = {

    render() {
      const s = S(), active = s.people.filter(p => p.status === 'Active');

      const me = St.me();
      const hr = new Date().getHours();
      const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
      const mine = pend.filter(r => St.canAct(r));
      const waiting = pend.map(r => ({ no: r.no, type: St.code(r.code).t.split(' · ')[0], who: St.subjectLabel(r), date: r.submitted, stage: (St.currentStep(r) ? St.STEP_LABEL[St.currentStep(r).role] : ''), cls: St.canAct(r) ? 'a' : 'b', href: '#/request/' + r.no }))
        .concat(lvMgr.map(l => ({ no: l.no, type: l.type + ' leave', who: St.nameOf(l.personId), date: l.submitted, stage: 'Direct manager', cls: 'a', href: '#/leave' })))
        .concat(s.requests.filter(r => r.status === 'Returned').map(r => ({ no: r.no, type: St.code(r.code).t.split(' · ')[0], who: St.subjectLabel(r), date: r.submitted, stage: 'Returned', cls: 'r', href: '#/request/' + r.no })))
        .sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
      const cats = [['Permanent', 'No end date'], ['Fixed-term', 'End date on the contract'], ['Part-time', 'Pro rata leave and pay'], ['Temporary', 'Short assignments'], ['Contract (SLA)', 'SLA linked to the project period'], ['Intern', 'Usually 18-month contract; Angels does HR on behalf of the client'], ['Social Performance intern', 'Linked to the project period'], ['Bursary holder', 'Bursary agreement (HR-08)'], ['Volunteer', 'Expenses only']];
      const catN = c => active.filter(p => p.cat === c || (c === 'Permanent' && p.cat === '[To confirm]')).length;

      const exc = [
        ['No signed agreement on file', active.filter(p => !verifiedDocs(p.id).includes('Signed contract / SLA') && p.cat !== 'Volunteer').length, 'r', '#/documents'],
        ['Banking change awaiting verification', pend.filter(r => r.code === '4.9').length, 'r', '#/approvals'],
        ['90-day review overdue', employees.filter(p => daysSince(p.start) > 90 && !p.reviews.d90).length, 'a', '#/performance'],
        ['Onboarding incomplete after 30 days', s.lifecycle.filter(l => l.kind === 'Onboarding' && daysSince(St.person(l.personId) ? St.person(l.personId).start : '') > 30 && l.tasks.some(t => t.st !== 'Done')).length, 'a', '#/lifecycle'],
        ['No direct manager assigned', employees.filter(p => !p.dm && p.id !== 'p1').length, 'r', '#/people'],
        ['Annual leave expiring in 60 days, not booked', active.filter(p => p.leave.expiring > 0 && within(p.leave.expiryDate, 60)).length, 'a', '#/leave'],
        ['Opening leave balances not yet signed off', s.leaveImport.filter(x => x.st !== 'Signed').length, 'a', '#/leaveimport'],
        ['Agreements expiring in 60 days', active.filter(p => within(p.endDate, 60)).length, 'b', '#/lifecycle']
      ];
      const openVac = s.vacancies.filter(v => v.st === 'Open').length;
      const unread = s.replies.filter(r => r.unread).length;
      return `
      ${header(greet + ', ' + esc(me.name.split(' ')[0]), 'Payroll cut-off 20 ' + St.fmtDate(St.todayIso()).slice(3) + ' · leave moves from SimplePay to PERSAL on 1 April 2027',
        `<a class="btn" href="#/recruitment">New vacancy</a><button class="btn pri" onclick="A.newRequest()">+ New request</button>`)}
      ${mine.length ? `<div class="info between"><span><strong>${mine.length} request${mine.length > 1 ? 's' : ''} waiting for you</strong> as ${esc(me.label)}.</span><a class="btn sm pri" href="#/approvals">Open approvals</a></div>` : ''}
      ${tiles([
        { l: 'People active', v: active.length, s: 'Staff, mentors, interns, bursaries', tag: 'Live', tc: 'b', href: '#/people' },
        { l: 'Vacant funded posts', v: vac.length, s: openVac + ' advertised now', tag: 'Recruit', tc: 'a', href: '#/establishment' },
        { l: 'Requests pending', v: pend.length, s: 'Across all approval stages', tag: 'Action', tc: 'p', href: '#/approvals' },
        { l: 'Leave with managers', v: lvMgr.length, s: 'Waiting for the direct manager', tag: 'Leave', tc: 'a', href: '#/leave' },
        { l: 'Documents missing', v: miss, s: 'Outstanding on personnel files', tag: 'Fix', tc: 'r', href: '#/documents' }
      ])}
      <div class="grid g-2">
        <section class="card" style="grid-column:1/-1;min-width:0">
          <div class="between" style="padding:18px 20px 6px"><h2 class="h2" style="margin:0">Waiting for action</h2><a href="#/approvals" class="small" style="font-weight:700">View all</a></div>
          <div style="padding:0 8px 8px">${table(['Reference', 'Request', 'Person', 'Submitted', 'Stage'], waiting.map(w => `<tr class="click" onclick="location.hash='${w.href}'"><td class="m small muted">${w.no}</td><td style="font-weight:700">${esc(w.type)}</td><td>${esc(w.who)}</td><td class="muted nw">${St.fmtShort(w.date)}</td><td>${pill(w.stage, w.cls)}</td></tr>`), { empty: 'All clear — nothing is waiting.' })}</div>
        </section>
        <section class="card pad" style="display:flex;flex-direction:column;gap:12px">
          <h2 class="h2" style="margin:0">People by category</h2>
          ${cats.map(([c, note]) => { const n = catN(c); return `<div><div class="between" style="font-size:13px"><span style="font-weight:600">${esc(c === 'Contract (SLA)' ? 'Contract (SLA) · mentors' : c === 'Intern' ? 'Interns · client-based' : c)}</span><span class="muted">${n}</span></div><div class="xs" style="color:var(--muted2);margin:2px 0 5px">${esc(note)}</div><div class="bar"><div style="width:${Math.round(n / maxN * 100)}%"></div></div></div>`; }).join('')}
        </section>
        <section class="card pad" style="display:flex;flex-direction:column;gap:8px">
          <h2 class="h2" style="margin:0 0 4px">Needs attention</h2>
          ${exc.map(([t, n, c, href]) => `<a href="${href}" class="flag" style="background:var(--${c}-bg);text-decoration:none;color:var(--ink)"><span class="dot" style="background:var(--${c})"></span><span style="flex:1">${esc(t)}</span><strong style="color:var(--${c})">${n}</strong></a>`).join('')}
        </section>
        <section class="card pad" style="display:flex;flex-direction:column;gap:4px">

        </section>
      </div>
      <p class="small" style="color:var(--muted2);margin:0">Test system with sample data · approved = record · records are never edited, only reversed by a new request · PERSAL numbers: 8 random digits with a check digit</p>`;
    }
  };

  /* ================= Post establishment ================= */
  const F = { dept: '', cat: '', paid: '', st: '', fund: '' };
  Pages.establishment = {
    title: 'Post establishment',
    render() {
      const s = S();

      const sel = (k, label, arr) => `<label class="f">${label}<select onchange="A.estF('${k}',this.value)"><option value="">All</option>${U.opts(arr, F[k])}</select></label>`;
      return `
      ${header('Post establishment', 'Financial year 2026/27 · approved by the CEO · version 03', `<button class="btn" onclick="A.estCsv()">Download register</button><button class="btn pri" onclick="A.newRequest('1.1')">+ Create post</button>`)}
      ${tiles([{ l: 'Total posts', v: all.length }, { l: 'Filled', v: all.filter(p => p.status === 'Filled').length, c: 'var(--g)' }, { l: 'Vacant funded', v: all.filter(p => p.status === 'Vacant funded').length, c: 'var(--a)' }, { l: 'Annual cost (filled)', v: 'R ' + (cost / 1e6).toFixed(1) + 'm' }])}
      <section class="card filters">
        ${sel('dept', 'Department', St.DEPTS)}${sel('cat', 'Person category', St.CATS)}${sel('paid', 'Paid through', ['SimplePay payroll', 'Invoice (SLA)', 'Stipend via SimplePay', 'Award (HR-08)', 'Not paid'])}${sel('st', 'Post status', ['Filled', 'Vacant funded', 'Unfunded'])}${sel('fund', 'Funder', St.FUNDERS)}

  };

  });

  /* ================= Grading & salary scales ================= */
  let G = { sal: 25000, mid: 25000 };
  const TITLES = [['Chief Executive Officer', 'Office of the CEO', 'L6', 'E'], ['Head of Operations and Systems', 'Operations', 'L5', 'D'], ['HOD Human Resources', 'Human Resources', 'L5', 'D'], ['Marketing HOD', 'Marketing / PR', 'L5', 'D'], ['Finance HOD', 'Finance', 'L5', 'D'], ['National Operations Co-ordinator (NOC)', 'Operations', 'L4', 'C upper'], ['Programme Manager: Bursaries & Internships (planned)', 'Human Resources', 'L4', 'C upper'], ['Programme Operations Coordinator (planned)', 'Operations', 'L4', 'C upper'], ['HOD Reports [check]', 'Finance', 'L4', 'C upper'], ['Operations and Programme Systems Coordinator', 'Operations', 'L3', 'C lower'], ['Social Performance Practitioner', 'Operations', 'L3', 'C lower'], ['Economic Development Administrator', 'Operations', 'L3', 'C lower'], ['Programme Lead E4C (planned)', 'Operations', 'L3', 'C lower'], ['PA to the CEO · Support to the Executive Team', 'Office of the CEO', 'L3', 'C lower'], ['Graphic & Digital Design', 'Marketing / PR', 'L3', 'C lower'], ['Bookkeeper [check: employee or outsourced]', 'Finance', 'L3', 'C lower'], ['HR Assistant', 'Human Resources', 'L2', 'B upper'], ['ED Administrator (planned)', 'Operations', 'L2', 'B upper'], ['Logistics Factotum', 'Logistics', 'L2', 'B upper']];
  const LV = { L6: 'p', L5: 'b', L4: 'g', L3: 'a', L2: 'x' };
  const stepAmounts = (m3, sp) => { const f = 1 + sp / 100; return [0, 1, 2, 3, 4].map(i => Math.round(m3 / (f * f) * Math.pow(f, i) / 50) * 50); };
  const fmtR = n => St.money0(n);
  function calcHtml() {
    const sp = Number(S().stepPct || 5), sal = Number(G.sal) || 0, m3 = Number(G.mid) || 0;
    const amt = stepAmounts(m3, sp);
    let res, hit = -1;
    if (!sal || !m3) res = { t: 'Enter a salary and a market rate', d: '', c: 'x' };
    else if (sal > amt[4]) res = { t: 'Above step 5', d: 'Salary is kept; smaller increases until the scale catches up (' + fmtR(sal - amt[4]) + ' above the maximum).', c: 'r' };
    else if (sal < amt[0]) res = { t: 'Below step 1', d: 'Brought up to step 1 in phases through the annual increase cycle (' + fmtR(amt[0] - sal) + ' short).', c: 'a' };
    else {
      hit = amt.findIndex(a => a === sal);
      if (hit >= 0) res = { t: 'On step ' + (hit + 1), d: (4 - hit) + ' step(s) of growth left in this title.', c: 'g' };
      else { const lo = amt.filter(a => a < sal).length; hit = lo - 1; res = { t: 'Between step ' + lo + ' and step ' + (lo + 1), d: 'Round up to step ' + (lo + 1) + ' (costs ' + fmtR(amt[lo] - sal) + ' a month), or keep the salary until the next annual increase.', c: 'b' }; }

      <div style="padding:12px 14px;border-radius:10px;background:var(--${res.c}-bg);color:var(--${res.c})"><strong>${res.t}</strong><div style="font-size:13px;margin-top:4px">${res.d}</div></div>`;

        <div class="grid g-3" style="padding:8px 20px 18px;font-size:13px">

      <section class="card" style="min-width:0">

        <div style="padding:0 8px 8px">${table(['Title', 'Department', 'Level', 'Paterson', 'Market rate (step 3)', 'Step 1', 'Step 2', 'Step 3', 'Step 4', 'Step 5'], TITLES.map(([t, d, l, p], i) => {

      <div class="grid g-2">

        <section class="card pad" style="display:flex;flex-direction:column;gap:8px;font-size:14px"><h2 class="h2" style="margin:0 0 6px">Rules</h2>
          ${['1. Jobs are graded, not people: the level comes from the job description.', '2. New appointments start on step 1 unless the starting step guide allows higher.', '3. Annual review (HR-07): rating 3 → 1 step; ratings 4–5 → 2 steps; ratings 1–2 → no step and a performance plan.', '4. Step 5 is the maximum. After that only the annual cost-of-living increase applies.', '5. Anyone already paid above step 5 keeps their salary and gets smaller increases until the scale catches up.', '6. Anyone below step 1 is brought up in phases through the annual increase cycle.', '7. A move to a higher level is a promotion into an approved, funded post.', '8. One increase date for everyone (start of the financial year): the annual increase and the review step happen together. Off-cycle increases only for a regrade or promotion, each through its own request.', '9. Funder-paid posts follow the same scale; the Head of Finance checks the budget, and if a funder will not cover an increase the reason is recorded.', '10. Every increase is kept on the person’s history with its date, type (annual, regrade, promotion) and approver.'].map(x => `<span>${x}</span>`).join('')}
          <div class="note" style="margin-top:6px">Outside the scale: mentors and other SLA contractors (rate bands, HR-09), interns (stipend scale, HR-04-INT-PROC-01), bursary holders (award, HR-08), volunteers (expenses only), and outsourced suppliers.</div>

          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center">${[['Applied', a.length], ['Shortlist', c('Shortlisted')], ['Interview', c('Interview')], ['Offer', c('Offer') + c('Appointed')]].map(([l, n]) => `<div class="box" style="padding:8px 4px"><div style="font-weight:800;font-size:18px">${n}</div><div class="xs muted">${l}</div></div>`).join('')}</div>

    rcStage(id, st) { const a = S().applicants.find(x => x.id === id); a.st = st; St.log('Changed', a.name, 'Applicant stage → ' + st, a.ref); St.save(); A.refresh(); },
    rcAppoint(id) { const a = S().applicants.find(x => x.id === id), v = vacOf(a.ref); const [first, ...rest] = a.name.split(' '); A.newRequest('2.2', null, { first, last: rest.join(' '), postNo: v.post }); },
    newVacancy(postNo) {
      const vac = S().posts.filter(p => p.status === 'Vacant funded' && !S().vacancies.some(v => v.post === p.no && v.st === 'Open'));
      if (!vac.length) return U.toast('No vacant funded posts without an open vacancy. Create or fund a post first.', 'bad');
      U.modal('New vacancy from post', `<div class="fg"><label class="f full">Post (vacant and funded only)<select name="post">${vac.map(p => U.opt(p.no, p.no + ' · ' + p.title, p.no === postNo)).join('')}</select></label><label class="f">Closing date<input type="date" name="close" value="${St.iso(St.addDays(new Date(), 21))}"></label><label class="f">Advert title<input name="title" placeholder="Defaults to the post title"></label></div><div class="note">Establishment rule 1: people are appointed only to a funded, vacant post.</div>`,
        [{ label: 'Cancel' }, { label: 'Create vacancy', cls: 'pri', onClick: m => {

          S().vacancies.unshift(v); St.log('Changed', '—', 'Vacancy ' + v.ref + ' opened for post ' + p.no, v.ref); RC.vac = v.ref; RC.t = 0; St.save(); U.toast('Vacancy ' + v.ref + ' created · job advert template loaded', 'ok'); U.go('recruitment'); A.refresh();
        } }]);

  /* ================= Internships & bursaries ================= */
  let PG = 0;
  Pages.programmes = {
    title: 'Internships & bursaries',
    render() {

      const progs = intern ? [
        { name: 'Internship programme 2026', funder: 'Scatec Y4C', period: 'Feb 2026 – Jan 2027', st: 'Running', a: [ppl.length, 'Interns'], b: [ppl.filter(p => !p.reviews.d90).length, 'Reviews due'], c: [s.progLogbooks ? s.progLogbooks.late : 1, 'Logbooks late'], used: 0.62 },
        { name: 'Learnership / SETA', funder: 'SETA', period: 'Apr 2026 – Mar 2027', st: 'Running', a: [0, 'Learners'], b: [0, 'Reviews due'], c: [0, 'Logbooks late'], used: 0.48 },
        { name: 'Internship programme 2027', funder: 'Scatec Y4C', period: 'Feb 2027 – Jan 2028', st: 'Recruiting', a: [0, 'Applicants'], b: [4, 'Posts'], c: [0, 'Placed'], used: 0 }
      ] : [
        { name: 'Bursary scheme 2026', funder: 'Seriti Green', period: 'Academic year 2026', st: 'Active', a: [ppl.length, 'Students'], b: [ppl.length, 'Results due'], c: [0, 'At risk'], used: 0.74 },
        { name: 'Angels bursary', funder: 'Core (Angels)', period: 'Academic year 2026', st: 'Active', a: [0, 'Students'], b: [0, 'Results due'], c: [0, 'At risk'], used: 0.55 },
        { name: 'Bursary scheme 2027', funder: 'Seriti Green', period: 'Academic year 2027', st: 'Applications open', a: [0, 'Applicants'], b: [0, 'Awards'], c: ['—', 'Closes'], used: 0 }
      ];
      const run = (s.progRun || {})[intern ? 'i' : 'b'] || 0;
      const payI = [['Attendance & logbooks confirmed', 'By mentors · cut-off 20th'], ['Stipend schedule', 'Prepared by HR Admin'], ['HOD HR approval', 'Dana'], ['Head of Finance · pay run', 'Gerald · pay date 25th']];
      const payB = [['Tuition to institutions', 'Paid against invoice'], ['Monthly allowance to students', 'Only if registration is current'], ['Books & equipment', 'Once-off, against quote'], ['Approval route', 'HR → HOD HR → Head of Finance']];
      const total = ppl.reduce((n, p) => n + (p.salary || 0), 0);
      const rules = intern ? ['Placed interns: direct manager is HOD HR (Angels), who approves leave and HR matters; the client supervisor is the functional manager. [Proposed]', 'Intern leave is not yet covered by HR-06: a rule is needed before interns use the leave portal. [Open]', 'Stipend is paid only when the month’s logbook and attendance are signed by the client supervisor. [Proposed]', 'Unauthorised absence is deducted pro rata from the stipend. [Proposed]', 'Client organisation confirms requirements and supervises; Angels runs recruitment, keeps records and holds safeguarding duty of care (HR-04-INT).', 'At completion: certificate issued, then absorbed into a vacant post or exited.', 'Outcome tracked 6 and 12 months after completion for funder reporting.']
        : ['Proof of registration each semester before any payment.', 'Results uploaded within 30 days of release; below 50% triggers a support plan, a second time a renewal review. [Values to confirm]', 'Tuition is paid to the institution, never to the student.', 'Work-back: months per year funded, recorded on the person record.', 'Breach of agreement = repayment schedule raised through Finance.'];
      return `
      ${header('Internships &amp; bursaries', 'Managed in HR by the Programme Manager: Bursaries &amp; Internships (planned role, reports to HOD HR, coordinates with the National Operations Co-ordinator) · payments approved by HOD HR, then Head of Finance', `<a class="btn pri" href="#/recruitment">+ New intake</a>`)}
      ${U.segs(['Internships', 'Bursaries'], PG, 'A.pgTab')}
      ${U.flow(intern ? 'Internship journey' : 'Bursary journey', (intern ? flowI : flowB).map(([t, d]) => ({ t, d })))}
      <div class="grid g-3">${progs.map(p => `<div class="card pad" style="display:flex;flex-direction:column;gap:10px">
        <div class="between" style="align-items:flex-start"><div><div style="font-weight:800;font-size:16px">${esc(p.name)}</div><div class="small muted">${esc(p.funder)} · ${esc(p.period)}</div></div>${pill(p.st, p.used ? 'g' : 'b')}</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center">${[p.a, p.b, p.c].map(x => `<div class="box" style="padding:8px 4px"><div style="font-weight:800;font-size:18px">${x[0]}</div><div class="xs muted">${x[1]}</div></div>`).join('')}</div>
        <div class="small muted">Budget used <strong style="color:var(--ink)">${Math.round(p.used * 100)}%</strong></div><div class="bar"><div style="width:${p.used * 100}%"></div></div></div>`).join('')}</div>
      <section class="card" style="min-width:0">
        <div class="between" style="padding:16px 20px 4px"><h2 class="h2" style="margin:0">${intern ? 'Interns' : 'Bursary holders'}</h2><span class="small muted">Click a name to open their person record</span></div>
        <div style="padding:0 8px 8px">${table(intern ? ['Intern', 'Category', 'Placed with', 'Functional manager', 'Period', 'Stipend', 'Status', 'Next action'] : ['Student', 'Bursary', 'Institution', 'Qualification', 'Period', 'Annual award', 'Status', 'Next action'], ppl.map(p => {
          const ending = within(p.endDate, 60);
          return `<tr><td class="nw"><a href="#/person/${p.id}" style="font-weight:700;text-decoration:none">${esc(St.fullName(p))}</a></td><td>${esc(intern ? p.cat : 'Seriti Green 2026')}</td><td>${esc(p.placedWith)}</td><td>${esc(intern ? (p.fm || '—') : p.title.split('·')[1] || '—')}</td><td class="nw">${St.fmtShort(p.start)} – ${St.fmtShort(p.endDate)}</td><td class="nw">${intern ? St.money0(p.salary) : 'R 85 000'}</td><td>${pill(ending ? 'Ending soon' : 'On track', ending ? 'a' : 'g')}</td><td class="muted">${ending ? 'Start exit or renewal' : '—'}</td></tr>`;
        }), { nw: false, empty: 'No people in this programme yet.' })}</div>
      </section>
      <div class="grid g-3">
        <section class="card pad"><h2 class="h2">${intern ? 'Monthly stipend run' : 'Disbursements · semester 2'}</h2>
          ${(intern ? payI : payB).map((x, i) => `<div class="list-row" style="align-items:center"><div><div style="font-size:14px;font-weight:700">${x[0]}</div><div class="small muted">${x[1]}</div></div>${i < run ? pill('Done', 'g') : i === run ? `<button class="btn sm pri" onclick="A.pgRun()">Mark done</button>` : pill('Waiting', 'x')}</div>`).join('')}
          <p class="small muted" style="margin:10px 0 0">${intern ? 'Total stipends this month: <strong>' + St.money0(total) + '</strong>. Finishing the run raises request 4.5 for HOD HR and the Head of Finance.' : 'Tuition is paid to the institution, never to the student.'}</p></section>
        <section class="card pad"><h2 class="h2">${intern ? 'Internship rules · stipend rules not yet in a policy' : 'Bursary conditions · HR-08 (draft)'}</h2><ul class="rules">${rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></section>
        <section class="card pad"><h2 class="h2">Outcomes for funder reports</h2><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px">${(intern ? [[0, 'Completed'], [1, 'Absorbed at Angels'], [0, 'Employed elsewhere'], [0, 'Exited early']] : [[ppl.length, 'Active students'], [0, 'Graduated'], [0, 'In work-back / employed'], [0, 'Discontinued']]).map(o => `<div class="box"><div style="font-size:24px;font-weight:800">${o[0]}</div><div class="small muted" style="font-weight:700">${o[1]}</div></div>`).join('')}</div>
          <button class="link" style="margin-top:12px" onclick="A.pgReport()">Download impact report</button></section>
      </div>`;
    }
  };
  Object.assign(A, {
    pgTab(i) { PG = i; A.refresh(); },
    pgRun() {
      const s = S(); s.progRun = s.progRun || {}; const k = PG === 0 ? 'i' : 'b';
      s.progRun[k] = (s.progRun[k] || 0) + 1;
      if (s.progRun[k] === 2) {
        const ppl = s.people.filter(p => p.status === 'Active' && (PG === 0 ? ['Intern', 'Social Performance intern'].includes(p.cat) : p.cat === 'Bursary holder'));
        const total = PG === 0 ? ppl.reduce((n, p) => n + (p.salary || 0), 0) : 25000;
        const prev = s.role; s.role = 'hradmin';
        const r = St.createRequest('4.5', null, { motivation: (PG === 0 ? 'Monthly stipend run · ' : 'Semester disbursement · ') + ppl.length + ' people', data: { amount: total }, subjectName: PG === 0 ? 'Stipend run (' + ppl.length + ' interns)' : 'Bursary disbursement' });
        s.role = prev; U.toast('Request ' + r.no + ' raised for HOD HR approval', 'ok');
      }
      if (s.progRun[k] >= 4) { s.progRun[k] = 0; U.toast('Run complete — restarting for next month', 'ok'); }
      St.save(); A.refresh();
    },
    pgReport() {
      const ppl = S().people.filter(p => ['Intern', 'Social Performance intern', 'Bursary holder'].includes(p.cat));
      U.download('programme-impact-' + St.todayIso() + '.csv', U.csv([['Name', 'Category', 'Placed with / institution', 'Start', 'End', 'Status']].concat(ppl.map(p => [St.fullName(p), p.cat, p.placedWith, p.start, p.endDate, p.status]))));
    }
  });
})();

</script>
<script>/* js/pages/people.js */
/* People · Person record · Staff import · Onboarding & exits · Documents */
(function () {
  const St = window.Store, U = window.UI, { esc, pill, spill, header, tiles, table, Pages } = U;
  const S = () => St.S;
  const role = () => S().role;

  /* ================= People list ================= */
  let PF = { q: '', cat: '', st: 'Active', dept: '' };
  Pages.people = {
    title: 'People',
    render() {
      let list = S().people.slice();
      if (PF.q) { const q = PF.q.toLowerCase(); list = list.filter(p => (St.fullName(p) + ' ' + (p.persal || '') + ' ' + p.title + ' ' + p.email).toLowerCase().includes(q)); }
      if (PF.cat) list = list.filter(p => p.cat === PF.cat);
      if (PF.st) list = list.filter(p => p.status === PF.st);
      if (PF.dept) list = list.filter(p => p.dept === PF.dept);
      return `
      ${header('People', 'Everyone Angels works with: employees, mentors on SLAs, interns, bursary holders and volunteers. Click a person to open their record.', `<button class="btn" onclick="A.peopleCsv()">Export list</button><a class="btn" href="#/import">Staff import</a><button class="btn pri" onclick="A.newRequest('2.2')">+ New appointment</button>`)}
      <section class="card filters">
        <label class="f">Search<input id="pq" value="${U.attr(PF.q)}" placeholder="Name, PERSAL no, title, email" oninput="A.pf('q',this.value,true)"></label>
        <label class="f">Category<select onchange="A.pf('cat',this.value)"><option value="">All</option>${U.opts(St.CATS, PF.cat)}</select></label>
        <label class="f">Department<select onchange="A.pf('dept',this.value)"><option value="">All</option>${U.opts(St.DEPTS, PF.dept)}</select></label>
        <label class="f">Status<select onchange="A.pf('st',this.value)"><option value="">All</option>${U.opts(['Active', 'Suspended', 'Exited'], PF.st)}</select></label>
      </section>
      <section class="card" style="min-width:0;padding:6px 8px" id="ptable">${peopleTable(list)}</section>`;
    },
    after() { const q = document.getElementById('pq'); if (q && PF._focus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); PF._focus = false; } }
  };
  function peopleTable(list) {
    return table(['Name', 'PERSAL no', 'Title', 'Department', 'Category', 'Direct manager', 'Start', 'Status'], list.map(p => `<tr class="click" onclick="location.hash='#/person/${p.id}'"><td style="font-weight:700" class="nw">${esc(St.fullName(p))}</td><td class="m small">${p.persal || pill('Not issued', 'a')}</td><td>${esc(p.title)}</td><td>${esc(p.dept)}</td><td>${esc(p.cat)}</td><td>${p.dm ? esc(St.nameOf(p.dm)) : (St.isEmployee(p) && p.id !== 'p1' ? pill('None', 'r') : '<span class="muted">—</span>')}</td><td class="nw muted">${St.fmtDate(p.start)}</td><td>${spill(p.status)}</td></tr>`), { empty: 'No people match.' });
  }
  Object.assign(A, {
    pf(k, v, keep) { PF[k] = v; if (keep) PF._focus = true; A.refresh(); },
    peopleCsv() {
      U.download('people-' + St.todayIso() + '.csv', U.csv([['Name', 'PERSAL no', 'Title', 'Department', 'Category', 'Paid through', 'Direct manager', 'Start', 'End', 'Status', 'Email']].concat(S().people.map(p => [St.fullName(p), p.persal || '', p.title, p.dept, p.cat, St.PAID[p.cat] || '', p.dm ? St.nameOf(p.dm) : '', p.start, p.endDate, p.status, p.email]))));
      St.log('Exported', '—', 'People list (CSV)');
    }
  });

  /* ================= Person record ================= */
  const reveal = {};
  let showCheck = false, chk = '';
  Pages.person = {
    title: 'Person record', nav: 'people',
    render(id) {
      const p = St.person(id);
      if (!p) return `<div class="card pad">Person not found. <a href="#/people">Back to People</a></div>`;
      const r = role(), canEE = ['hodhr', 'ceo'].includes(r), isHR = ['hradmin', 'hodhr'].includes(r);
      const initials = (p.first[0] + (p.last.replace(/[()]/g, '')[0] || '')).toUpperCase();

      const docsFor = S().docs.filter(d => d.personId === p.id);

      const lvFor = S().leave.filter(x => x.personId === p.id);
      const hist = reqFor.map(x => ({ t: St.code(x.code).t.split(' · ')[0] + ' · ' + x.status.toLowerCase(), d: x.approvedAt || x.submitted, b: x.status === 'Approved' ? (x.route[x.route.length - 1].by || St.STEP_LABEL[x.route[x.route.length - 1].role]) : St.STEP_LABEL[(St.currentStep(x) || x.route[0]).role], n: x.no, href: '#/request/' + x.no }))
        .concat(lvFor.map(l => ({ t: l.type + ' leave ' + St.fmtShort(l.from) + (l.to !== l.from ? '–' + St.fmtShort(l.to) : '') + ' ' + l.status.toLowerCase(), d: l.decidedAt || l.submitted, b: l.decidedBy || 'Leave portal', n: l.no })))
